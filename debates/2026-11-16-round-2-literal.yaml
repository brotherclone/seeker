    argument: Meeting the finished thing, you watch a pen scratch a squiggly line across paper while a
      General MIDI piano plays the notes that are the line. It is a piano-roll visualizer filmed slowly.
      A piano roll is already pitch on one axis and time on the other, so calling the result a 'map' only
      renames the axes. The viewer never encounters a territory, a place, a landmark or a shape that means
      anything, because the image is the music's own graph and there is nothing uncanny in the gap between
      the two. The sync is the rationale's selling point, but it is guaranteed by construction. A guarantee
      gives no tension, no drift, no surprise. Nothing can go wrong, so nothing is felt. The cliché is
      the generative-art or data-sonification demo, where a process is the whole show and the output is
      whatever it happens to be. The General MIDI synth makes it worse. It is the stock, beige sound of
      every ringtone, and it is a missing opportunity for a dreamlike or strange sonic world. Stop-motion
      normally brings handmade warmth and a ghost of the animator's body. Here a machine plots the line,
      so the labor, the tactility and the human error that would make stop-motion tender are removed.
