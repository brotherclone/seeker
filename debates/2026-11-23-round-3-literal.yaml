      behavior: The parish picks the memorial engagement whose battalion war diary (WO 95) gives both
        zero hour and the hour the action closed. A two-metre slotted drum, made of plywood on a bicycle-hub
        bearing and lit by candles inside, stands in the nave. Its inner wall holds one empty card sleeve
