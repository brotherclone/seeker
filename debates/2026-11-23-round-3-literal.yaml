        is filmed or photographed. The officiant reads the names at even intervals across the hours. After
        each one the congregation answers 'Grant them eternal rest', and a warden drops that name's card
        into its sleeve as it passes. At walking pace this is easy, because a drum with hundreds of frames
        turns slowly at the rim. Through the slits, the first cards are only stray poses of a man flaring
        and vanishing at random points around the drum. As more names are answered, the poses crowd together
        and start to fuse. He twitches, lurches, staggers, and for the last stretch he walks. The final
        response completes the cycle, and for a few minutes he walks smoothly for the first time. At the
        diary's closing hour the cranking stops and the drum coasts to rest. He halts mid-stride on whatever
        frame happens to face the slits, a man caught in the act of walking and not laid down.
      rationale: 'A zoetrope makes a living body only when its frames are present and evenly spaced. Filling
