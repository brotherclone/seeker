        the hours fighting began and ended. It is re-fought at 1:1 time with the literal 1824 Reisswitz
        Kriegsspiel. The rules come from the 1824 Anleitung in Leeson's translation, played with its own
        casualty dice and blocks. The map is drawn at the rule's scale from the real ground in contemporary
        trench maps. Each block hides one name from the memorial roll. The two commanders sit in separate
        garden sheds and send written orders by runner. About a dozen audience members crowd behind each
        commander. The only image in each shed is a live, unbroken infrared feed from inside a glass observation
        hive, projected on the shed wall, with the contact mic on a speaker. The umpire never reports
        casualties. When dice strike a block, he carries it to the hive, knocks three times and speaks
        the name. The knocks reach the sheds as dull thuds through the comb, and the names stay inaudible.
        The commander must decide whether to press or withdraw by reading the comb, and the audience watches
        him read it. Some of the roar is his dead. Some is heat, the queen's state or the colony's own
        business. At the diary's closing hour the umpire drapes the hive in black crepe and both projectors
        go dark. Nothing is recorded.
      rationale: In Kriegsspiel, a commander knows only what the umpire chooses to tell him. Here the
        umpire tells the bees instead, so every casualty report passes through a living colony with moods
        of its own. The commander cannot separate his losses from a hot afternoon. That is the fog of
        war made biological, and real time is what forces him to act on it rather than wait it out. The
        audience no longer watches anonymous bees in the abstract. They watch a man try to read grief
        off a comb, misread it, and send more blocks forward. The film's subject becomes that act of misreading,
        live and unrepeatable, rather than a hushed vigil with bees standing for grief.
