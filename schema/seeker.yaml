id: https://github.com/brotherclone/seeker/schema
name: seeker
title: Seeker ontology
description: >-
  The ontology of record for Seeker, an idea engine for creative technology.
  Ideas are generated by colliding topic cards drawn from independent decks
  (a morphological box), checked against prior art, and argued over by
  adversarial agents. This schema defines the deck layer: cards, the decks that
  hold one axis of cards, the deck set a run draws from, and the creative
  fields cards belong to. Later changes extend it with ideas, roles, debates
  and runs.
version: 0.1.0
license: MIT
see_also:
  - https://github.com/brotherclone/seeker/blob/develop/docs/concept.md
prefixes:
  seeker: https://github.com/brotherclone/seeker/schema/
  linkml: https://w3id.org/linkml/
  skos: http://www.w3.org/2004/02/skos/core#
  dcterms: http://purl.org/dc/terms/
default_prefix: seeker
default_range: string
imports:
  - linkml:types

types:
  CardId:
    typeof: string
    uri: seeker:CardId
    description: >-
      Stable identifier for a card, unique across every deck in a deck set so a
      card id alone identifies a card in run records. Lowercase kebab-case.
    pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
    examples:
      - value: granular-synthesis
      - value: ben-day-dots
  AxisId:
    typeof: string
    uri: seeker:AxisId
    description: >-
      Identifier for an axis of the morphological box. Each deck holds exactly
      one axis, and a deck file is named after its axis. Lowercase kebab-case.
    pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
    examples:
      - value: technique
      - value: historical-artifact
  Tag:
    typeof: string
    uri: seeker:Tag
    description: >-
      Free-form lowercase kebab-case label for grouping or filtering cards,
      outside the controlled creative-field vocabulary.
    pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
    examples:
      - value: demoscene
  Synonym:
    typeof: string
    uri: seeker:Synonym
    description: >-
      An alternative name a card goes by in some specialist literature. Synonyms
      drive prior-art query expansion, so they should be the words another
      community would actually search for. Non-empty with no leading or
      trailing whitespace.
    pattern: "^\\S(.*\\S)?$"
    examples:
      - value: microsound

  Sha256Digest:
    typeof: string
    uri: seeker:Sha256Digest
    description: >-
      A SHA-256 content digest as 64 lowercase hex characters. Used to pin
      exactly which deck content a draw or run used.
    pattern: "^[0-9a-f]{64}$"
    examples:
      - value: 41909d46fec8a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a

  ModelId:
    typeof: string
    uri: seeker:ModelId
    description: >-
      Identifier of a Claude model as the API names it. Recorded on every
      generation so results can be attributed to the model that produced them.
    pattern: "^claude-[a-z0-9-]+$"
    examples:
      - value: claude-opus-5-5
  GitCommit:
    typeof: string
    uri: seeker:GitCommit
    description: >-
      A full git commit hash, suffixed with -dirty when the working tree had
      uncommitted changes, pinning the code, decks and prompts a run used.
    pattern: "^[0-9a-f]{40}(-dirty)?$"
    examples:
      - value: 5085562a1b2c3d4e5f60718293a4b5c6d7e8f90a

  WorkId:
    typeof: string
    uri: seeker:WorkId
    description: >-
      Stable identifier for a work, derived from its note's file name reduced
      to lowercase kebab-case, so renaming the note renames the work.
    pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
    examples:
      - value: oramics-demo-tape-1962
  Url:
    typeof: uri
    uri: seeker:Url
    description: >-
      An absolute http or https web address, such as the page a work was
      captured from.
    pattern: "^https?://\\S+$"
    examples:
      - value: https://daphneoram.org/

enums:
  CreativeField:
    description: >-
      The creative fields Seeker draws ideas from. A card belongs to every field
      it lists; a card listing none is cross-cutting and applies to all fields.
      Cards spanning several fields are the bridges between literatures that
      literature-based discovery looks for.
    permissible_values:
      music:
        description: Composition, performance, sound design, synthesis and audio production.
      visual-art:
        description: Drawing, painting, printmaking, generative and computational visual art, installation.
      film:
        description: Film, video, animation and moving-image work of any length or format.
      electronics:
        description: Sensors, circuits, microcontrollers, displays and physical computing.
      writing:
        description: Creative writing, poetry, interactive and procedural text, audio drama.
      comics:
        description: Comics, sequential art, strips, webcomics and minicomics.
      games:
        description: Board, card, tabletop role-playing and electronic games.

  Reading:
    description: >-
      How freely the generator may interpret the cards it is dealt. Round 1
      reads literally; round 2 varies only this setting.
    permissible_values:
      literal:
        description: Cards mean exactly what they name.
      loose:
        description: Cards may be taken by their spirit as well as their letter.
      metaphorical:
        description: Cards may stand for something they evoke rather than what they name.
  Effort:
    description: >-
      How much effort a model puts into a response, as the Claude API's
      output_config.effort. Higher effort is more thorough, slower and costlier.
    permissible_values:
      low:
        description: Quickest and cheapest; minimal deliberation.
      medium:
        description: Balanced speed and thoroughness.
      high:
        description: Thorough; the default for creative roles.
      xhigh:
        description: More thorough than high, at higher cost.
      max:
        description: The most thorough the model offers; slowest and costliest.
  RoleName:
    description: >-
      The agent roles in Seeker's pipeline. Each role is defined by a YAML file
      in prompts/. The generator states ideas; the critics, advocate and judge
      debate and rank them.
    permissible_values:
      generator:
        description: Turns one draw into one idea stated as a single sentence.
      prosecutor:
        description: Argues an idea has been done, citing catalog works and web results.
      skeptic:
        description: Argues an idea cannot be built with Gabe's gear, stack and time.
      taste_critic:
        description: Argues an idea is boring even if it is new and buildable.
      advocate:
        description: Answers every critique and may revise or withdraw the idea.
      judge:
        description: Compares two debated ideas blind and picks a winner on each axis.

  WorkKind:
    description: >-
      What sort of thing a captured work is. Coarse on purpose: the cards a
      work links say what it is about, the kind says what form it takes.
    permissible_values:
      piece:
        description: A finished artwork, composition or comic not better described by another kind.
      recording:
        description: A released or archived audio or video recording.
      instrument:
        description: A musical instrument or sound-making machine, built or designed.
      software:
        description: A program, plugin, tool or code library.
      game:
        description: A board, card, tabletop or electronic game.
      publication:
        description: A book, zine, magazine, album booklet or other edition.
      performance:
        description: A live performance, concert or happening.
      installation:
        description: A site-specific or gallery installation.
      paper:
        description: A research paper, thesis or technical report.
      product:
        description: A commercial device or kit.
      other:
        description: Anything else; the capture default until refined by hand.
  CaptureSource:
    description: >-
      Who or what added a work to the vault, so hand-captured works can be told
      apart from ones agents found or imported in bulk.
    permissible_values:
      gabe:
        description: Captured by hand, usually with the Web Clipper template.
      prosecutor:
        description: Found by the prior-art prosecutor during a debate and cached.
      import:
        description: Imported in bulk from another catalog.

  CritiqueTarget:
    description: >-
      Which part of an idea a critique says fails. Naming the part keeps a
      critique from being a general complaint.
    permissible_values:
      subject:
        description: The thing being made (the X) is wrong, vague or not new.
      behavior:
        description: What the thing does (the Y) fails or cannot be done.
      rationale:
        description: The reason (the Z) is false, circular or does not matter.
      card_reading:
        description: One card was read in a way the idea does not earn.
      constraint:
        description: The idea does not satisfy its constraint card.
  Severity:
    description: >-
      How badly a critic says an idea fails. Critics set it themselves, so the
      judge never sees it.
    permissible_values:
      fatal:
        description: If true, the idea should not survive as stated.
      serious:
        description: A real problem the idea must answer, short of killing it.
      minor:
        description: A small or speculative problem, or no prior art found.
  DefenseMove:
    description: How the advocate answers one critique.
    permissible_values:
      concede:
        description: The critique is right.
      rebut:
        description: The critique is wrong or does not matter, with an argument why.
  DefenseOutcome:
    description: What the advocate does with the idea after answering every critique.
    permissible_values:
      defended:
        description: The idea stands as stated.
      revised:
        description: The idea is restated to survive the critiques.
      withdrawn:
        description: The advocate gives the idea up; it does not compete.
  ScoreAxis:
    description: >-
      The separate axes ideas are judged on. Each axis keeps its own rating;
      they are never blended into one score.
    permissible_values:
      novelty:
        description: How far the idea is from its nearest prior art.
      feasibility:
        description: Whether one person can build it with Gabe's actual gear, stack and time.
      promise:
        description: Whether there is something there worth making.
  StopReason:
    description: Why a debate run stopped before or after finishing.
    permissible_values:
      finished:
        description: Every debate and comparison is done.
      budget:
        description: The run's estimated spend reached its budget; it can be resumed with more.
      no_tournament:
        description: The run was asked to debate only and stopped before the tournament.

slots:
  id:
    identifier: true
    range: CardId
    required: true
    slot_uri: seeker:id
    description: The card's stable identifier, unique across the deck set.
  name:
    range: string
    required: true
    slot_uri: skos:prefLabel
    description: Human-readable name, as it should appear in prompts and reports.
  synonyms:
    range: Synonym
    multivalued: true
    slot_uri: skos:altLabel
    description: >-
      Other names for the card in specialist literatures, used to expand
      prior-art searches. Must not repeat the name or each other,
      case-insensitively.
  fields:
    range: CreativeField
    multivalued: true
    slot_uri: seeker:fields
    description: >-
      The creative fields the card belongs to. Empty means cross-cutting:
      the card applies to every field.
  tags:
    range: Tag
    multivalued: true
    slot_uri: seeker:tags
    description: Free-form labels outside the creative-field vocabulary.
  note:
    range: string
    slot_uri: skos:scopeNote
    description: Optional clarification of what the card means or excludes.
  axis:
    identifier: true
    range: AxisId
    required: true
    slot_uri: seeker:axis
    description: The axis this deck holds; must match the deck file's name.
  description:
    range: string
    required: true
    slot_uri: dcterms:description
    description: One line on what the axis contributes to a draw.
  cards:
    range: Card
    multivalued: true
    inlined_as_list: true
    required: true
    minimum_cardinality: 1
    slot_uri: seeker:cards
    description: The cards on this axis, in a meaningful order.
  decks:
    range: Deck
    multivalued: true
    inlined_as_list: true
    required: true
    minimum_cardinality: 1
    slot_uri: seeker:decks
    description: Every deck in the set, one per axis.
  seed:
    range: integer
    required: true
    minimum_value: 0
    slot_uri: seeker:seed
    description: >-
      The non-negative integer the draw's random stream is derived from. The
      same seed, deck content and batch size always produce the same batch.
  deck_set_digest:
    range: Sha256Digest
    required: true
    slot_uri: seeker:deckSetDigest
    description: >-
      Digest of the deck set the batch was drawn from. Replaying against decks
      with a different digest is an error.
  draws:
    range: Draw
    multivalued: true
    inlined_as_list: true
    required: true
    minimum_cardinality: 1
    slot_uri: seeker:draws
    description: The draws in the batch, in position order.
  position:
    range: integer
    required: true
    minimum_value: 1
    slot_uri: seeker:position
    description: The draw's 1-based position within its batch.
  axes:
    range: AxisId
    multivalued: true
    required: true
    minimum_cardinality: 3
    maximum_cardinality: 3
    slot_uri: seeker:axes
    description: >-
      The three axes the draw's cards come from, constraint first, then the
      other two in canonical order (technique, medium, historical-artifact,
      domain). This is the draw's shape.
  home_field:
    range: CreativeField
    required: true
    slot_uri: seeker:homeField
    description: >-
      The creative field this draw is anchored in. At least one of its cards
      explicitly lists this field.
  drawn_cards:
    range: Card
    inlined: false
    multivalued: true
    required: true
    minimum_cardinality: 3
    maximum_cardinality: 3
    slot_uri: seeker:drawnCards
    description: >-
      The drawn cards, referenced by card id, one per axis in the same order
      as axes.

  statement:
    range: string
    required: true
    slot_uri: seeker:statement
    description: >-
      The idea as one sentence of the form "a/an X that does Y because Z", at
      most 60 words.
  subject:
    range: string
    required: true
    slot_uri: seeker:subject
    description: The X of the statement, meaning the thing being made.
  behavior:
    range: string
    required: true
    slot_uri: seeker:behavior
    description: The Y of the statement, meaning what the thing does.
  rationale:
    range: string
    required: true
    slot_uri: seeker:rationale
    description: >-
      The Z of the statement, meaning why the idea works or matters, as a real
      reason rather than a restatement.
  card_readings:
    range: CardReading
    multivalued: true
    inlined_as_list: true
    required: true
    minimum_cardinality: 3
    maximum_cardinality: 3
    slot_uri: seeker:cardReadings
    description: How the generator read each drawn card, in the draw's card order.
  card:
    range: Card
    inlined: false
    required: true
    slot_uri: seeker:card
    description: The card being interpreted, referenced by card id.
  interpretation:
    range: string
    required: true
    slot_uri: seeker:interpretation
    description: One line on how the card was taken in this idea.
  usage:
    range: Usage
    inlined: true
    required: true
    slot_uri: seeker:usage
    description: Tokens consumed by the model calls this record accounts for.
  reason:
    range: string
    required: true
    slot_uri: seeker:reason
    description: Why no idea was recorded for this draw.
  input_tokens:
    range: integer
    required: true
    minimum_value: 0
    slot_uri: seeker:inputTokens
    description: Uncached input tokens billed at the model's input rate.
  output_tokens:
    range: integer
    required: true
    minimum_value: 0
    slot_uri: seeker:outputTokens
    description: Output tokens billed at the model's output rate.
  cache_read_tokens:
    range: integer
    required: true
    minimum_value: 0
    slot_uri: seeker:cacheReadTokens
    description: Input tokens served from the prompt cache.
  cache_write_tokens:
    range: integer
    required: true
    minimum_value: 0
    slot_uri: seeker:cacheWriteTokens
    description: Input tokens written to the prompt cache.
  web_search_requests:
    range: integer
    minimum_value: 0
    ifabsent: int(0)
    slot_uri: seeker:webSearchRequests
    description: >-
      Web searches the model ran through the server-side search tool, billed
      per search on top of tokens. Absent in records written before searches
      existed, which means none.
  max_searches:
    range: integer
    minimum_value: 0
    ifabsent: int(0)
    slot_uri: seeker:maxSearches
    description: >-
      The most web searches one call of this role may run. Zero means the
      role is not offered the search tool.
  reading:
    range: Reading
    required: true
    slot_uri: seeker:reading
    description: How freely the cards may be interpreted.
  guidance:
    range: string
    required: true
    slot_uri: seeker:guidance
    description: The prompt text that tells the model how to read the cards at this setting.
  role_name:
    range: RoleName
    required: true
    slot_uri: seeker:roleName
    description: Which role in the pipeline this is.
  model:
    range: ModelId
    required: true
    slot_uri: seeker:model
    description: The Claude model the role runs on.
  persona:
    range: string
    required: true
    slot_uri: seeker:persona
    description: Who the role speaks as, which sets its taste and its blind spots.
  system_prompt:
    range: string
    required: true
    slot_uri: seeker:systemPrompt
    description: The role's standing instructions and rules.
  reading_guidance:
    range: ReadingGuidance
    multivalued: true
    inlined_as_list: true
    required: true
    minimum_cardinality: 3
    maximum_cardinality: 3
    slot_uri: seeker:readingGuidance
    description: Exactly one guidance text per Reading value.
  max_output_tokens:
    range: integer
    required: true
    minimum_value: 1
    slot_uri: seeker:maxOutputTokens
    description: The most output tokens one call of this role may produce.
  effort:
    range: Effort
    required: true
    slot_uri: seeker:effort
    description: >-
      How much effort the model puts into each call of this role. This is the
      API's output_config.effort, which replaced sampling temperature.
  draw_batch:
    range: DrawBatch
    inlined: true
    required: true
    slot_uri: seeker:drawBatch
    description: The batch the ideas were generated from, embedded so the record stands alone.
  role_digest:
    range: Sha256Digest
    required: true
    slot_uri: seeker:roleDigest
    description: SHA-256 of the role file's bytes, so any prompt edit is visible.
  git_commit:
    range: GitCommit
    slot_uri: seeker:gitCommit
    description: The repository commit the generation ran from, when known.
  generated_at:
    range: datetime
    required: true
    slot_uri: seeker:generatedAt
    description: When the generation started.
  ideas:
    range: Idea
    multivalued: true
    inlined_as_list: true
    slot_uri: seeker:ideas
    description: The ideas produced, in draw position order.
  failures:
    range: GenerationFailure
    multivalued: true
    inlined_as_list: true
    slot_uri: seeker:failures
    description: Draws that produced no valid idea, in position order.
  estimated_cost_usd:
    range: float
    required: true
    minimum_value: 0
    slot_uri: seeker:estimatedCostUsd
    description: >-
      The total usage priced with the configured price table. It is an
      estimate, because prices change and are kept as data.

  title:
    range: string
    required: true
    slot_uri: dcterms:title
    description: The work's title as its creators give it.
  creators:
    range: string
    multivalued: true
    slot_uri: dcterms:creator
    description: >-
      The people or groups who made the work, as plain names. Notes may write
      them as wikilinks so they show up in the vault's graph.
  year:
    range: integer
    slot_uri: dcterms:date
    description: The year the work was made, released or published, when known.
  url:
    range: Url
    slot_uri: seeker:url
    description: Where the work can be found or was captured from.
  kind:
    range: WorkKind
    required: true
    slot_uri: dcterms:type
    description: What form the work takes.
  summary:
    range: string
    slot_uri: dcterms:abstract
    description: >-
      A short description of the work. Card suggestions search it along with
      the title and the note body.
  captured_by:
    range: CaptureSource
    required: true
    slot_uri: seeker:capturedBy
    description: Who or what added the work to the vault.
  captured_on:
    range: date
    required: true
    slot_uri: seeker:capturedOn
    description: The date the work was added to the vault.
  relevance:
    range: string
    required: true
    slot_uri: seeker:relevance
    description: One sentence on how close the cited work is to the idea.
  cited_work:
    range: WorkId
    slot_uri: seeker:citedWork
    description: A captured work cited as prior art, referenced by work id.
  embodied_cards:
    range: Card
    inlined: false
    multivalued: true
    slot_uri: seeker:embodiedCards
    description: >-
      The cards of the idea's draw that the cited work already embodies,
      referenced by card id.
  target:
    range: CritiqueTarget
    required: true
    slot_uri: seeker:target
    description: Which part of the idea the critique says fails.
  target_card:
    range: Card
    inlined: false
    slot_uri: seeker:targetCard
    description: The card whose reading fails, when the target is a card reading.
  severity:
    range: Severity
    required: true
    slot_uri: seeker:severity
    description: How badly the critic says the idea fails.
  failure:
    range: string
    required: true
    slot_uri: seeker:failure
    description: >-
      The specific failure, in one sentence that says something the idea's
      statement does not.
  argument:
    range: string
    required: true
    slot_uri: seeker:argument
    description: The reasoning behind a critique or a reply.
  citations:
    range: Citation
    multivalued: true
    inlined_as_list: true
    slot_uri: seeker:citations
    description: The evidence a prior-art critique rests on.
  none_found:
    range: boolean
    ifabsent: "false"
    slot_uri: seeker:noneFound
    description: >-
      True when the prosecutor searched and found no prior art. Such a
      critique carries no citations and is minor.
  answers:
    range: RoleName
    required: true
    slot_uri: seeker:answers
    description: The critic role whose critique this reply answers.
  move:
    range: DefenseMove
    required: true
    slot_uri: seeker:move
    description: Whether the advocate concedes or rebuts the critique.
  replies:
    range: Reply
    multivalued: true
    inlined_as_list: true
    required: true
    minimum_cardinality: 1
    maximum_cardinality: 3
    slot_uri: seeker:replies
    description: One reply per critique, in critique order.
  outcome:
    range: DefenseOutcome
    required: true
    slot_uri: seeker:outcome
    description: What the advocate did with the idea.
  revision:
    range: IdeaRevision
    inlined: true
    slot_uri: seeker:revision
    description: The restated idea, present exactly when the outcome is revised.
  critiques:
    range: Critique
    multivalued: true
    inlined_as_list: true
    required: true
    minimum_cardinality: 1
    maximum_cardinality: 3
    slot_uri: seeker:critiques
    description: >-
      The critiques the idea faced, in role order. Fewer than three means a
      critic failed and is recorded as a debate failure.
  defense:
    range: Defense
    inlined: true
    required: true
    slot_uri: seeker:defense
    description: The advocate's answer to the critiques.
  final_statement:
    range: string
    required: true
    slot_uri: seeker:finalStatement
    description: The statement that competes, the revision's when the idea was revised.
  failure_reason:
    range: string
    required: true
    slot_uri: seeker:failureReason
    description: Why a role produced no valid answer, even after a retry.
  axis_name:
    range: ScoreAxis
    required: true
    slot_uri: seeker:axisName
    description: The score axis this verdict or rating is on.
  winner:
    range: integer
    required: true
    minimum_value: 1
    slot_uri: seeker:winner
    description: The position of the idea that won on this axis.
  ruling:
    range: string
    required: true
    slot_uri: seeker:ruling
    description: The judge's one-sentence reason for the verdict.
  first:
    range: integer
    required: true
    minimum_value: 1
    slot_uri: seeker:first
    description: The position of the idea shown to the judge as A.
  second:
    range: integer
    required: true
    minimum_value: 1
    slot_uri: seeker:second
    description: The position of the idea shown to the judge as B.
  verdicts:
    range: AxisVerdict
    multivalued: true
    inlined_as_list: true
    maximum_cardinality: 3
    slot_uri: seeker:verdicts
    description: One verdict per score axis; empty when the comparison failed.
  failed:
    range: boolean
    ifabsent: "false"
    slot_uri: seeker:failed
    description: True when the judge gave no valid answer even after a retry; ratings are unchanged.
  rating:
    range: float
    required: true
    slot_uri: seeker:rating
    description: The Elo rating on this axis after every comparison so far.
  wins:
    range: integer
    required: true
    minimum_value: 0
    slot_uri: seeker:wins
    description: Comparisons won on this axis.
  losses:
    range: integer
    required: true
    minimum_value: 0
    slot_uri: seeker:losses
    description: Comparisons lost on this axis.
  k_factor:
    range: float
    required: true
    minimum_value: 0
    slot_uri: seeker:kFactor
    description: How far one comparison moves a rating (the Elo K).
  initial_rating:
    range: float
    required: true
    slot_uri: seeker:initialRating
    description: The rating every entrant starts at, on every axis.
  max_comparisons:
    range: integer
    required: true
    minimum_value: 1
    slot_uri: seeker:maxComparisons
    description: The most comparisons the tournament may schedule.
  entrants:
    range: integer
    multivalued: true
    slot_uri: seeker:entrants
    description: The positions of the ideas that competed, in position order.
  comparisons:
    range: Comparison
    multivalued: true
    inlined_as_list: true
    slot_uri: seeker:comparisons
    description: The comparisons made, in schedule order.
  ratings:
    range: Rating
    multivalued: true
    inlined_as_list: true
    slot_uri: seeker:ratings
    description: One rating per entrant per axis, recomputable from the comparisons.
  survivors:
    range: integer
    multivalued: true
    slot_uri: seeker:survivors
    description: The positions of the top entrants by promise, best first.
  skipped:
    range: boolean
    ifabsent: "false"
    slot_uri: seeker:skipped
    description: True when fewer than two ideas could compete, so no comparison was made.
  generation_path:
    range: string
    required: true
    slot_uri: seeker:generationPath
    description: The generation record debated, relative to the repository root when inside it.
  generation_digest:
    range: Sha256Digest
    required: true
    slot_uri: seeker:generationDigest
    description: SHA-256 of the generation record's bytes, so a changed input is caught on resume.
  role_digests:
    range: RoleDigest
    multivalued: true
    inlined_as_list: true
    required: true
    minimum_cardinality: 5
    maximum_cardinality: 5
    slot_uri: seeker:roleDigests
    description: The digest of every debate role file the run used.
  catalog_digest:
    range: Sha256Digest
    required: true
    slot_uri: seeker:catalogDigest
    description: >-
      Digest of the works catalog when the run started. It may change during
      the run, because the prosecutor's finds are added to the catalog.
  tournament_seed:
    range: integer
    required: true
    minimum_value: 0
    slot_uri: seeker:tournamentSeed
    description: The integer that pairings, A/B order and objection order are derived from.
  started_at:
    range: datetime
    required: true
    slot_uri: seeker:startedAt
    description: When the run first started.
  budget_usd:
    range: float
    required: true
    minimum_value: 0
    slot_uri: seeker:budgetUsd
    description: The estimated spend at which the run stops cleanly, in US dollars.
  stop_reason:
    range: StopReason
    slot_uri: seeker:stopReason
    description: Why the run last stopped; absent while it is running.
  debates:
    range: Debate
    multivalued: true
    inlined_as_list: true
    slot_uri: seeker:debates
    description: The finished debates, in position order.
  debate_failures:
    range: DebateFailure
    multivalued: true
    inlined_as_list: true
    slot_uri: seeker:debateFailures
    description: Roles that produced no valid answer, in position then role order.
  tournament:
    range: Tournament
    inlined: true
    slot_uri: seeker:tournament
    description: The ranking of the debated ideas, once it has started.

classes:
  Card:
    class_uri: seeker:Card
    description: >-
      One topic card, the atom of a draw. A draw takes one card from each of
      several decks and asks whether the collision is a real idea.
    see_also:
      - https://en.wikipedia.org/wiki/Morphological_analysis_(problem-solving)
    slots:
      - id
      - name
      - synonyms
      - fields
      - tags
      - note
  Deck:
    class_uri: seeker:Deck
    description: >-
      All the cards on one axis of the morphological box, loaded from one file
      in decks/. Axes are independent, so cards from different decks combine
      freely.
    slots:
      - axis
      - name
      - description
      - cards
  DeckSet:
    class_uri: seeker:DeckSet
    tree_root: true
    description: >-
      Every deck a run draws from. Card ids are unique across the whole set and
      the set must include the required starting axes: technique, medium,
      historical-artifact, constraint and domain.
    slots:
      - decks
  Draw:
    class_uri: seeker:Draw
    description: >-
      One collision: three cards, one from each of three axes, always
      including a constraint. The raw material the generator turns into a
      one-sentence idea.
    slots:
      - position
      - axes
      - home_field
      - drawn_cards
  DrawBatch:
    class_uri: seeker:DrawBatch
    description: >-
      A balanced set of draws produced from one seed and one deck set: shapes
      evenly represented, no card repeated, home fields rotating through the
      creative fields. Fully reproducible from its seed and deck-set digest.
    slots:
      - seed
      - deck_set_digest
      - draws
  Usage:
    class_uri: seeker:Usage
    description: >-
      Token counts for one or more model calls, split the way they are billed.
    slots:
      - input_tokens
      - output_tokens
      - cache_read_tokens
      - cache_write_tokens
      - web_search_requests
  CardReading:
    class_uri: seeker:CardReading
    description: >-
      How the generator interpreted one drawn card. Under a metaphorical
      reading this is the only record of what a card was taken to mean.
    slots:
      - card
      - interpretation
  Idea:
    class_uri: seeker:Idea
    description: >-
      One idea generated from one draw: a single sentence of the form "a/an X
      that does Y because Z", its three parts, and how each card was read.
    slots:
      - position
      - statement
      - subject
      - behavior
      - rationale
      - card_readings
      - usage
  GenerationFailure:
    class_uri: seeker:GenerationFailure
    description: >-
      A draw for which no valid idea was produced, even after a retry.
    slots:
      - position
      - reason
      - usage
  ReadingGuidance:
    class_uri: seeker:ReadingGuidance
    description: The prompt text a role uses for one Reading setting.
    slots:
      - reading
      - guidance
  Role:
    class_uri: seeker:Role
    description: >-
      One agent role in the pipeline, defined by a versioned YAML file in
      prompts/: its model, persona, standing instructions and per-reading
      guidance.
    slots:
      - role_name
      - model
      - persona
      - system_prompt
      - reading_guidance
      - max_output_tokens
      - effort
      - max_searches
  Generation:
    class_uri: seeker:Generation
    description: >-
      One generator pass over a draw batch: the ideas and failures it
      produced, every input pinned (batch, reading, model, role digest,
      commit), and its token usage and estimated cost.
    slots:
      - draw_batch
      - reading
      - role_name
      - model
      - role_digest
      - git_commit
      - generated_at
      - ideas
      - failures
      - usage
      - estimated_cost_usd
  Citation:
    class_uri: seeker:Citation
    description: >-
      One piece of prior-art evidence: a web page the prosecutor's searches
      returned, or a work already in the vault's catalog.
    slots:
      - title
      - url
      - cited_work
      - relevance
      - embodied_cards
  Critique:
    class_uri: seeker:Critique
    description: >-
      One critic's attack on one idea, naming the part that fails, how badly,
      and the failure in one sentence.
    slots:
      - role_name
      - model
      - target
      - target_card
      - severity
      - failure
      - argument
      - citations
      - none_found
      - usage
  Reply:
    class_uri: seeker:Reply
    description: The advocate's answer to one critique.
    slots:
      - answers
      - move
      - argument
  IdeaRevision:
    class_uri: seeker:IdeaRevision
    description: >-
      An idea restated by the advocate to survive its critiques, in the same
      one-sentence form and from the same draw.
    slots:
      - statement
      - subject
      - behavior
      - rationale
  Defense:
    class_uri: seeker:Defense
    description: >-
      The advocate's answer to every critique of one idea, and what became of
      the idea.
    slots:
      - model
      - replies
      - outcome
      - revision
      - usage
  Debate:
    class_uri: seeker:Debate
    description: >-
      One idea's round of debate: the critiques it faced, the advocate's
      defense, and the statement that goes on to compete.
    slots:
      - position
      - critiques
      - defense
      - final_statement
  DebateFailure:
    class_uri: seeker:DebateFailure
    description: A debate role that produced no valid answer for one idea, even after a retry.
    slots:
      - position
      - role_name
      - model
      - failure_reason
      - usage
  AxisVerdict:
    class_uri: seeker:AxisVerdict
    description: The judge's verdict on one score axis of one comparison.
    slots:
      - axis_name
      - winner
      - ruling
  Comparison:
    class_uri: seeker:Comparison
    description: >-
      One blind pairwise judgment between two debated ideas, with a winner on
      each score axis.
    slots:
      - first
      - second
      - verdicts
      - failed
      - model
      - usage
  Rating:
    class_uri: seeker:Rating
    description: One idea's Elo rating on one score axis.
    slots:
      - position
      - axis_name
      - rating
      - wins
      - losses
  Tournament:
    class_uri: seeker:Tournament
    description: >-
      The ranking of a run's debated ideas: the comparisons made, the per-axis
      Elo ratings they produce, and the survivors.
    see_also:
      - https://en.wikipedia.org/wiki/Elo_rating_system
    slots:
      - k_factor
      - initial_rating
      - max_comparisons
      - entrants
      - comparisons
      - ratings
      - survivors
      - skipped
  RoleDigest:
    class_uri: seeker:RoleDigest
    description: The digest of one role file a run used.
    slots:
      - role_name
      - role_digest
  DebateRun:
    class_uri: seeker:DebateRun
    description: >-
      One debate over a recorded generation: its pinned inputs, every debate
      and failure, the tournament, and its usage and estimated cost.
    slots:
      - generation_path
      - generation_digest
      - role_digests
      - catalog_digest
      - git_commit
      - tournament_seed
      - started_at
      - budget_usd
      - stop_reason
      - debates
      - debate_failures
      - tournament
      - usage
      - estimated_cost_usd
  Work:
    class_uri: seeker:Work
    description: >-
      A creative work, instrument, game, publication or paper that already
      exists, captured as a note in the Obsidian vault and linked to the cards
      it embodies. Works are Seeker's offline prior art: a draw whose cards a
      work already combines is not new.
    see_also:
      - https://en.wikipedia.org/wiki/Literature-based_discovery
    slots:
      - id
      - title
      - creators
      - year
      - url
      - kind
      - fields
      - cards
      - summary
      - captured_by
      - captured_on
    slot_usage:
      id:
        range: WorkId
        description: The work's identifier, derived from its note's file name.
      fields:
        description: The creative fields the work belongs to, when known.
      cards:
        range: Card
        inlined: false
        inlined_as_list: false
        required: false
        minimum_cardinality: 0
        description: >-
          The cards the work embodies, referenced by card id. Empty until
          linked by hand or by card suggestions.
