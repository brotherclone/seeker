  statement: An erasure chapbook dubbed generation by generation on a photocopier, where each page keeps
    at most eight visible words and revealing a new word forces blacking out the oldest, because copier
    blur and overwriting enact taped-over memory, making forgetting the poem's structure rather than its
    subject.
  subject: A hand-bound erasure chapbook made by repeatedly photocopying one found letter
  behavior: Each page is a photocopy of the previous one. On every page the poet blacks out text so that
    no more than eight words stay visible. To uncover a new word, the oldest surviving word must be redacted,
    the way a synth steals its oldest note. The copies blur page by page, so the poem drifts as the source
    decays.
  rationale: Erasure poems usually freeze one reading of a source. Here the source is rewritten like a
    dubbed cassette, and the strict eight-word cap forces the poet to give up earlier lines to gain new
    ones. A reader can follow one sentence being remembered, overwritten and blurred across the book,
    using only a copier and a marker.
  card_readings:
  - card: eight-voices-max
    interpretation: 'Read as polyphony with voice-stealing: no more than eight words may be audible on
      a page, and a new one silences the oldest.'
  - card: erasure
    interpretation: 'Taken literally as the core writing act: blacking out a found text until a poem remains.'
  - card: vhs-tape
    interpretation: 'Read as taping over and generational dub loss: each copy overwrites memory and degrades
