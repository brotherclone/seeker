  subject: A one-take FM performance score built from a real railway's graphical timetable
  behavior: A performer plays a two-operator FM box once through, moving a clock-hand slider across a
    Marey-style graphical timetable cut from a real regional line, compressed to 18 minutes. Every train
    is an oscillator, and wherever two train lines meet at a station the performer patches the slower
    train in as modulator of the faster one for exactly the dwell time. A missed connection is final and
    sounds as a bare, unmodulated sine.
  rationale: 'FM is famously hard to steer live, because small ratio changes swing the sound wildly. The
    timetable works the way a real railway timetable does: it settles every encounter in advance so nothing
    collides, and that makes an unforgiving synth playable in a single take. The audience hears the line''s
    actual traffic density as timbre, and any lapse by the performer survives as an audible pure-tone
    mistake.'
  card_readings:
  - card: one-take
    interpretation: 'A departure you can''t call back: the piece runs once in real time, with no restart
