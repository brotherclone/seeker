- position: 11
  statement: A live lumia film played on a Clavilux rebuilt from Wilfred's patents, projected through
    an observation hive's glass, whose drifting light steers the colony's waggle dances toward or away
    from a filmed feeder, because von Frisch showed comb dancers take a lamp for the sun, so every beautiful
    sweep of light misdirects real foragers.
  subject: A live, single-take lumia film projected through a glass observation hive from a rebuilt Clavilux,
    shown beside a live feed of a distant sugar feeder
  behavior: 'In a dark gallery, one performer plays a Clavilux rebuilt from Wilfred''s 1920s patent drawings:
    a lamp, rotating reflectors, coloured gels and a slider console. Its slow lumia forms are projected
    through the glass of a vertical observation hive onto a scrim, so the audience sees Wilfred''s luminous
    veils drifting across the living comb. Beside it runs a second live, unbroken single-take feed of
    a sugar feeder set 300 m due north of the gallery''s hive exit. The piece rests on Karl von Frisch''s
    finding that dancers on a vertical comb orient their waggle runs to a bright light as if it were the
    sun. Wherever the lumia''s brightest form sits, it re-aims the dances, and recruits fly out on that
    bearing. Bees cannot see red, so in red and amber passages the dancers fall back to gravity. Blue
    and white passages capture them. The performer must keep the feeder busy while playing a lumia worth
    watching. Every beautiful sweep of light sends foragers the wrong way, and a misdirected flight shows
    up as an empty dish only minutes later. The audience watches the player read the comb and the feeder
    and compose against that lag. The show starts with the first forager out and ends when the colony
    stops flying at dusk. It cannot be rehearsed, paused or recorded, because no two afternoons of the
    colony are the same.'
  rationale: Von Frisch showed that comb dancers take a lamp for the sun, so a lumia played on the glass
    is not decoration. It is the colony's sky, and each colour and position redirects living animals.
    That makes the hive a decision channel again, which the parent's debate found was the only truly new
    part. It also drops the memorial vigil. The audience watches a performer's composition get vetoed
    or obeyed by a colony that answers late and in its own terms. Wilfred's dream of a music for the eye
    gains a listener that acts on it, and the trade-off between beauty and steering is visible on the
    comb and at the feeder.
  card_readings:
  - card: real-time-only
