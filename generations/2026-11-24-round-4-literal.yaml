- position: 2
  statement: A Tenebrae zoetrope lit only by the hearse's fifteen candles, cranked at constant speed while
    one candle is snuffed after each psalm, whose drawn flames stutter in full light and burn ever more
    smoothly as the chapel darkens, because flicker fusion drops with brightness, so the real fire's death
    is what brings the painted fire to life.
  subject: A one-metre hand-cranked zoetrope built around a Tenebrae hearse, its only light the service's
    fifteen candles, made for one Holy Week office
  behavior: In a small chapel on a Wednesday of Holy Week, the fifteen candles of the Tenebrae hearse
    stand on a fixed tray inside a one-metre plywood zoetrope. The drum turns on a lazy-susan bearing
    around them, and its candles are the only light in the room. The inner strip is a hand-inked cycle
    of candle flames burning. One performer cranks at a constant rate for the whole office while a few
    people sing the psalms and the call-and-response responsories. After each psalm the performer reaches
    through the top and snuffs one real candle. At full light the drawn flames visibly strobe and judder.
    As the real candles go out, the same crank speed makes the drawn flames burn more and more smoothly,
    until by a single candle they flicker as fluidly as living fire. The last candle is then hidden, the
    strepitus is struck in total dark, and the candle is returned, so the drawn flames come back for a
    moment before everyone leaves in silence. Nothing is filmed.
  rationale: The eye's flicker-fusion threshold falls as light dims (the Ferry–Porter law). So a drum
    cranked at constant speed strobes in bright light and fuses into smooth motion in dim light. The liturgy's
    own darkening is what animates the drawing, and the congregation watches painted fire come alive exactly
    as the real fire dies. That is a perceptual fact they feel in their own eyes, not a symbol they decode.
  card_readings:
  - card: real-time-only
    interpretation: The animation is lit only by the office's own dying candles and cranked unbroken through
      one Tenebrae. It is too dark to film, and a camera would not see the smoothing a human eye sees.
  - card: zoetrope
    interpretation: The literal slotted drum with a hand-drawn strip of burning candle flames on its inner
      wall, lit from inside by the real hearse candles.
  - card: liturgy
    interpretation: 'Tenebrae''s ritual order: psalms, call-and-response responsories, one candle snuffed
      after each psalm, the hidden last candle and the strepitus in the dark.'
