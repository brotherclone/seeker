    watches him lose in named blocks.
  subject: A live, unrecorded single-take film of the western sky, with a barometer in frame, projected
    in two Kriegsspiel commanders' sheds where the audience sits behind them
  behavior: A parish's First World War engagement is chosen because its war diary fixes the start and
    end hours of the fighting. It is re-fought at 1:1 time under the 1824 Reisswitz Anleitung, with its
    blocks, dice and scale map of the real ground. Each block hides one name from the memorial roll. The
    two commanders sit apart in garden sheds and send written orders by runner, with a dozen audience
    members behind each. The only image in each shed is a live, unbroken, single-take shot of the western
    horizon. A brass barometer and a hand-lettered card of the morning's Met Office forecast sit in frame.
    The umpire has a rooftop station of rain gauge, anemometer and visibility markers. Using the discretion
    Reisswitz gives him, he rules smoke, mud, sight lines and fire effect from what it reads that afternoon.
    The commanders never see his readings, so each must forecast the next hour from the sky on the wall
    and the falling needle, then time his attacks by that guess. At the diary's closing hour both cameras
    are capped. Nothing is recorded.
  rationale: 'Kriegsspiel hides the battlefield from its players, and forecasting is how people act on
    an hour that has not arrived yet. Fusing the two turns every order into a bet on the sky. Today''s
    real afternoon weather is what decides whether a named block survives, and the commander can reason
    about it but never know it. That keeps the parent''s working engine: a man committing men forward
    on an unreliable live signal, with the audience behind him watching the misreading happen. It drops
    the borrowed bees-as-grief imagery. Real time is essential, because a forecast checked after the fact
    is no longer a forecast.'
  card_readings:
  - card: real-time-only
