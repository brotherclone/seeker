- position: 5
  statement: A single-take, real-time film of a full sung Requiem in which the clergy covertly play an
    1824 Kriegsspiel, sending orders inside the Gospel book and posting casualties on the hymn boards,
    because the Mass's silent couriering already matches the wargame's structure and an unexplained, uncut
    take makes viewers discover the war themselves rather than be told it.
  subject: A single-take, real-time feature film of a staged sung Requiem Mass in a parish church, shot
    from the west gallery
  behavior: A volunteer congregation hears a complete sung Requiem in a rented church, filmed in one uncut,
    unscored hour from the west gallery. Nothing is explained, on screen or to the congregation. Inside
    the service, the ministers play a full 1824 Kriegsspiel. The sacristan umpires in the sacristy over
    the map and blocks, out of shot. The two commanders are the deacon and the subdeacon, kneeling at
    opposite ends of the sanctuary. Every two minutes, the Kriegsspiel turn length, a server carries a
    written order to the sacristy folded inside the Gospel book. The sacristan rolls the casualty dice
    and changes the numerals on the two hymn boards to post the results. Each commander reads only his
    own board. As losses mount, the ministers grow visibly rattled. They fumble the thurible, and one
    hesitates at the altar. The liturgy cannot stop for any of it. The film ends at the dismissal, wherever
    the battle stands.
  rationale: Kriegsspiel was a war fought entirely through silent couriers carrying paper to a mediator,
    and a Mass is already a choreography of silent ministers carrying books between fixed stations. That
    shared structure lets the game hide inside the liturgy without breaking it. Because the take is uncut
    and nothing is announced, no edit, caption or programme explains the game. The viewer is not given
    a thesis. They catch it slowly through wrong-looking hymn numbers and a deacon's shaking hands, and
    once seen it cannot be unseen.
  card_readings:
  - card: real-time-only
    interpretation: A single uncut take with no edit, pause or retake. The game runs on Kriegsspiel's
      two-minute turns inside the hour of the Mass and stops at the dismissal.
  - card: kriegsspiel
    interpretation: 'The literal 1824 Prussian wargame: a map with metal blocks, an umpire with casualty
      dice, and two separated commanders who send written orders and receive only the umpire''s reports.'
  - card: liturgy
    interpretation: A complete sung Requiem Mass with versicles and responses. Its ordered movements of
      ministers, books and hymn boards carry the game's messages.
