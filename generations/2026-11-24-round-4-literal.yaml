  statement: A single-take film that follows a beekeeper commanding a real swarm chase from a literal
    1824 Kriegsspiel map table, with runner-delayed reports and an umpire, at 1:1 time until the swarm
    is hived or lost, because a swarm picks its home by scout vote no doctrine can predict, so the wargame
    meets an enemy with no strategy to read.
  subject: A live single-take documentary film of a beekeeper's swarm chase run as a literal 1824 Kriegsspiel
  behavior: The film begins when a beekeeper's hive throws a real May swarm. A beekeeper-commander sits
    at an 1824 Reisswitz map of the parish, drawn at the rule's scale. Scattered catchers send him written
    reports by bicycle runner, delayed by the 1824 messenger-speed rules. An umpire watching the cluster
    moves the swarm block and decides what the commander is told. The commander orders catchers with skeps
    toward where he thinks the scouts will vote to go. One continuous 1:1 take shows the map table from
    the issue of the swarm until it is hived or lost over the horizon.
  rationale: Every Kriegsspiel opponent until now has been a human playing by doctrine. A swarm chooses
    its objective by a decentralized scout vote that no commander can read in advance. Against it, the
    old staff machinery of delay and partial report becomes absurd and also strangely apt. The beekeeper
    must act before the swarm commits and cannot wait for it, so the camera films decisions made blind
    rather than bees standing in for grief.
  card_readings:
  - card: real-time-only
    interpretation: The swarm's departure and the scouts' vote happen once, on their own clock, so the
      game and the single unbroken take run 1:1 from issue to hiving or loss, with no restaging.
  - card: kriegsspiel
    interpretation: 'The literal 1824 Reisswitz apparatus, used as written: scale map, blocks, a separated
      commander, written orders, messenger delays and an umpire who controls all information.'
  - card: beekeeping
    interpretation: 'Real swarm management: a colony casting a swarm, scout bees choosing a new home,
      and a beekeeper''s team chasing the cluster with skeps to hive it.'
