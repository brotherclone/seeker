- position: 6
  statement: A nine-hour, uncut, real-time triptych film of Königgrätz played as Reisswitz's Kriegsspiel
    by two commanders who must leave to chant the canonical hours, while the umpire silently keeps rolling
    casualties, because the war proceeding unattended through prayer ambushes both players and viewers
    with a complicity that nobody explains.
  subject: A nine-hour real-time triptych film of the Battle of Königgrätz (3 July 1866) played as an
    1824 Kriegsspiel, interrupted by the canonical hours
  behavior: Two volunteers command Austria and Prussia in Reisswitz's 1824 Kriegsspiel through a single
    uncut day, from 8am to the battle's end. The game advances in his two-minute turns, so play runs 1:1
    with the clock. Each commander has agreed to keep the canonical hours from a breviary, so at Terce,
    Sext and None they must leave the table, kneel in separate rooms and chant the Office. Nobody tells
    them the umpire keeps running turns while they pray. He moves their blocks on their last written orders
    and rolls casualty dice. Three fixed cameras film the two prayer rooms and the empty map table, and
    the result is shown as a triptych at full length, uncut. During each Office the audience watches the
    dead accumulate on the table while both commanders sing psalms, unaware. Each commander learns what
    happened in his absence only when he returns from the hour.
  rationale: Kriegsspiel was the drill that trained the Prussian staff who won Königgrätz, and the canonical
    hours are the oldest human practice of stopping work at a fixed time. Run both on the same unbroken
    clock and they collide without anyone staging a thesis. The war goes on while its makers pray, and
    the commanders' shock at the changed map is real, unscripted and caught on camera. Real-time film
    is the only form that can hold both clocks honestly. Each Office lasts as long as it lasts, and the
    viewer has to sit through that interval of unattended killing too. The piece needs only one room,
    three friends, three cameras and a breviary.
  card_readings:
  - card: real-time-only
    interpretation: The game, the shoot and the screening all run on one unbroken clock matching the real
      battle's hours, with no cuts, pauses or replays.
  - card: kriegsspiel
    interpretation: 'The literal 1824 Prussian wargame: a terrain map, metal blocks, written orders, two-minute
      turns, and an umpire rolling casualty dice.'
  - card: liturgy
    interpretation: 'The Liturgy of the Hours: fixed daily Offices of chanted psalm and response that
      pull the commanders away from the table at set times.'
