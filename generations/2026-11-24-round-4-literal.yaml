- position: 3
  statement: A single silent screening of the 1916 Somme film in a parish nave, scored live on a Fairlight
    CMI that samples each 'Grant them eternal rest' the congregation answers to a memorial name, because
    the sampler turns a plea for the dead's rest into the music under men still walking on screen, heard
    once and never saved.
  subject: A one-time, unrecorded live Fairlight CMI score for a church screening of The Battle of the
    Somme (1916)
  behavior: The parish projects The Battle of the Somme (1916) once, silent, from a hired 16mm print onto
    a sheet in the nave. A borrowed Fairlight CMI Series II sits on a trestle with one microphone hung
    over the pews. Its operator is the only musician. Across the film's 77 minutes the officiant reads
    the memorial names at even intervals, and the congregation answers 'Grant them eternal rest'. Each
    answer is sampled straight into the Fairlight, and the operator plays it on the keyboard against the
    images, pitched down and slowed. At the CMI's low sample rate this turns into a grainy, aliased drone.
    Each new response is loaded into the next of its eight voices. Once all eight are full, the oldest
    response is overwritten. The congregation therefore hears its own plea come back as the score while
    men on screen joke, smoke and march up to the line. The score is never saved to floppy. When the last
    reel runs out, the operator switches the Fairlight off, and the held chord of the final eight answers
    is gone.
  rationale: The Fairlight was the first instrument that could take a room's voice and hand it back as
    music within seconds. Here that speed means the prayer reaches the screen before its echo has faded.
    The plea for rest becomes the soundtrack for men who are still walking, still alive, still about to
    go over. The contradiction is carried by sound rather than spelled out by a mechanism. The CMI's crude
    sampling also makes the congregation's voices uncanny, so they hear themselves turned strange. The
    only thing the operator has to build is a single performance on a borrowed machine.
  card_readings:
  - card: real-time-only
    interpretation: The score exists only during one screening. Every sound is sampled live from the room
      and played at once, nothing is saved to floppy, and the machine is switched off at the end.
  - card: fairlight-cmi
    interpretation: The literal 1979 Fairlight CMI sampler, with its microphone input, eight voices and
      low-bit, low-rate sampling. It turns a voice into a playable instrument within seconds.
  - card: liturgy
    interpretation: The Office of the Dead's call and response. The officiant reads a name, and the congregation's
      spoken 'Grant them eternal rest' is the only source material the score has.
