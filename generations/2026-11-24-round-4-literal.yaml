- position: 4
  statement: A shop-window zoetrope on a town's Whit Walk route that animates a hundred years of newspaper
    photos as one stride-mismatched walker, its last missing frame shot live from the passing procession,
    because the zoetrope fuses any frames whose poses line up, so a century of strangers becomes one body
    that only completes if today's walker steps into the gap.
  subject: A hand-cranked plywood zoetrope in a shop window on a town's annual Whit Walk route, built
    from one man's photocopies of the local newspaper's archive
  behavior: 'From the local paper''s morgue, the builder photocopies one press photo per year of the annual
    Whit Walk, each showing a walker mid-stride. The walkers are cropped, scaled and ordered by leg position,
    not by date, into a zoetrope cycle. One gait phase is left blank. On Walk day the plywood drum sits
    in a shop window on the route, and passers-by crank it only while the procession is passing. Through
    the slits, one figure walks, but every frame is a different decade: coat, grain and face jump from
    1931 to 1987 to 1958, and the stride hitches at the blank. The builder stands at the kerb with an
    instant camera, waiting for a living walker whose legs hit exactly the missing pose. When one does,
    the print goes into the gap and the walk runs smooth. When the last walker passes, the cranking stops.
    Nothing is filmed, and the strip is unpinned that evening.'
  rationale: Persistence of vision fuses any frames whose poses line up, whoever is in them. So matching
    gait overrides mismatched identity, and a century of a town's walkers becomes one uncanny body that
    flickers through decades at every step. Unlike a fixed allegory, the ending is truly uncertain. Whether
    the stride ever completes depends on a stranger's legs hitting the right phase before the procession
    ends, a match the builder must spot live.
  card_readings:
  - card: real-time-only
    interpretation: The drum turns only between the first and last walker passing the window on Walk day,
      with no filming, no replay and no second showing.
  - card: zoetrope
    interpretation: A literal slotted drum with a paper strip whose evenly spaced walk-cycle frames fuse
      into one moving figure through the slits.
  - card: local-newspaper-archives
    interpretation: The local paper's morgue and microfilm of its yearly Whit Walk coverage, the source
      of one photographed stride per year.
