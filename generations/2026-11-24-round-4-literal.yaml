- position: 1
  statement: A one-metre zoetrope of a single drawn singing mouth that one performer cranks through the
    Preces of Evensong, frozen during each versicle and spinning only while the room sings 'And our mouth
    shall shew forth thy praise', because the singers end up lip-syncing to the drawing and become a live
    soundtrack dubbing a pre-sound film.
  subject: A one-metre hand-cranked zoetrope of a drawn singing mouth, played by one performer for a sung
    Evensong preces with whoever is in the room
  behavior: 'One performer sets up a one-metre plywood drum on a lazy-Susan bearing in any room. Inside
    are 24 hand-drawn frames: a single singing mouth, drawn huge, that forms the vowels and consonants
    of ''And our mouth shall shew forth thy praise.'' One revolution of the drum lasts exactly one sung
    response. Ten to thirty people stand around the drum, each with a slit at eye level. The performer
    chants the Preces of Evensong and cranks the drum. At each versicle the performer stops the drum dead,
    so the mouth is a frozen still. At each response the people sing while the performer cranks, and the
    drawn mouth comes alive and mouths their words. It is in sync only if the crank and the room''s tempo
    agree. Within two responses the singers stop leading and start following the mouth, and they slow
    or quicken to keep their lips on its lips. The last response brings the drum to rest with the mouth
    open. Nothing is filmed or amplified.'
  rationale: Pre-sound cinema could never make a drawn mouth speak, and synchronised sound later solved
    the problem by making actors serve the soundtrack. A zoetrope has no soundtrack. Here the congregation
    is the soundtrack, and the drum quietly takes over the tempo of the prayer. The singers find themselves
    lip-syncing to a drawing that is mouthing their own words. That is an uncanny inversion of dubbing,
    which they feel in their own throats rather than decode as an allegory. It needs one tabletop-scale
    drum, one performer and whoever turns up.
  card_readings:
  - card: real-time-only
    interpretation: The lip sync exists only between living voices and a live hand on the crank at that
      moment. It cannot be filmed, played back or dubbed afterwards, and it falls apart the instant either
      side drifts.
  - card: zoetrope
    interpretation: A literal slotted drum with a 24-frame hand-drawn strip of a singing mouth, viewed
      through slits by people standing around it. One revolution equals one sung response.
  - card: liturgy
    interpretation: The versicles and responses of Choral Evensong. The performer sings 'O Lord, open
      thou our lips' and the room answers 'And our mouth shall shew forth thy praise.'
