- position: 14
  statement: A live-projected Kriegsspiel requiem that re-fights a parish's memorial battle at 1:1 time
    on an 1824 map table, the umpire's casualty dice calling each dead man's name for the congregation
    to answer 'Grant them eternal rest,' because chance deciding who is named restores the arbitrariness
    and complicity a tidy alphabetical war memorial erases.
  subject: A live, unrecorded overhead projection of a historical Kriegsspiel table, performed as a parish
    requiem service
  behavior: A parish's own engagement (one battle from its war memorial) is re-fought on a von Reisswitz-style
    1824 map table. An overhead camera feeds a projector in the nave directly, with nothing stored. Two
    parishioners command from separate vestries and send written orders by runner, under the umpire's
    clock. Moves run at 1:1 with the historical timeline, and the game is never paused. Whenever the umpire's
    casualty dice strike a block, the officiant reads the next name drawn from the memorial roll, and
    the congregation answers 'Grant them eternal rest.' When the real engagement's hour of ending arrives,
    the projector is switched off mid-move. Any names not yet called are then read in silence by each
    person from a printed roll.
  rationale: Memorials list the dead alphabetically and by rank, which makes their dying look orderly.
    Kriegsspiel was built to turn soldiers into calculable losses. When its dice call the requiem, the
    congregation sees the arithmetic and the randomness together. A real name lands on whichever block
    the dice happen to hit, and the clock can run out before some names are reached. Parishioners give
    the orders that 'kill' their own great-grandfathers' names. That gives the mourning stakes and complicity,
    so it never reads as a mindfulness program.
  card_readings:
  - card: real-time-only
    interpretation: The game runs on a 1:1 clock against the historical battle, with no pause, no replay
      and no recording, and the service ends at the hour the real fighting stopped.
