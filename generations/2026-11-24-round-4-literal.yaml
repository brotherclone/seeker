- position: 13
  statement: A candlelit church zoetrope whose soldier's walk cycle has one frame per name on the parish
    memorial, cranked unbroken from the war diary's zero hour to its closing hour while each name read
    and answered is lifted from the drum, because the congregation watches its own responses break a man's
    stride until only a motionless still remains.
  subject: A large hand-cranked zoetrope stood in a parish nave for a single, unrecorded Office of the
    Dead
  behavior: The parish picks the memorial engagement whose battalion war diary (WO 95) fixes both zero
    hour and the hour the action closed. A two-metre slotted drum stands in the nave, lit from inside
    by candles. It carries a hand-drawn walk cycle of one soldier in period kit, advancing. The cycle
    has exactly as many frames as the memorial has names, and each frame is lettered at its foot with
    one name. Sidesmen take turns cranking the drum at a steady rate from zero hour to the closing hour,
    without stopping. Nothing is filmed or photographed. The congregation stands around the drum, looking
    through the slits. The officiant reads names at even intervals across those hours. After each name
    the congregation answers 'Grant them eternal rest', and a warden lifts that frame out of the moving
    drum. Nobody announces what the removals will do. At first the man walks smoothly. Then he hitches,
    limps, jumps and strobes as gaps open in the cycle. At the diary's closing hour one frame is left,
    the one name never read aloud. The drum keeps turning, and through the slits there is only a man standing
    still.
  rationale: A zoetrope makes a living body only while every frame is present and evenly spaced, so each
    frame that goes is felt in the eye as a stumble before anyone works out the cause. Nobody explains
    complicity. The congregation watches its own spoken responses take apart a man's stride, one hitch
    at a time. The ending is the medium itself running backwards, from moving picture to still photograph,
    and it happens at the hour the war diary says the fighting stopped. The only historical facts needed
    are two diary hours and a memorial roll, and the parts are paper, a drum, candles and a crank.
  card_readings:
  - card: real-time-only
    interpretation: The drum turns without a break, from the war diary's zero hour to its closing hour,
      with no pause, recording or replay. The animation exists only while it spins in front of the people
      present.
  - card: zoetrope
    interpretation: The literal 1830s slotted drum and paper strip, viewed through slits, which makes
      motion out of an unbroken, evenly spaced sequence of frames, here a soldier's walk cycle.
  - card: liturgy
    interpretation: The Office of the Dead's call and response. The officiant calls a dead man's name,
      the congregation answers 'Grant them eternal rest', and that answer is what takes his frame out
      of the drum.
