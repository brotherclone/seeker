- position: 15
  statement: A live, unrecorded single-take film of the inside of an observation hive that runs while
    a Kriegsspiel re-fights a parish's war-memorial battle at 1:1 time, its umpire telling the bees each
    struck block's hidden name, because a colony's alarm builds and decays on its own clock, so the commanders'
    only casualty report is a roar nobody can script or stop.
  subject: A live, unrecorded single-take film projected from inside a glass observation hive while a
    Kriegsspiel is played out of the audience's sight in a parish apiary
  behavior: 'A parish''s First World War engagement is chosen because its battalion war diary (WO 95)
    fixes the hours fighting began and ended. It is re-fought freely on an 1824-style Kriegsspiel map
    table at 1:1 time, never paused or recorded. One name from the memorial roll is hidden under each
    unit block, and the commanders are given nothing beyond the rules. The two commanders sit in separate
    garden sheds and send written orders by runner. When the umpire''s dice strike a block, he turns it
    over and carries it to a glass observation hive. Following the old custom of telling the bees, he
    knocks three times and speaks the name to the hive. A contact mic inside the hive feeds a small speaker
    in each shed. The commanders get no casualty report: their only report is the hive''s roar swelling.
    The audience sits in the dark and never sees the game. They watch a single unbroken live projection
    from an infrared camera inside the hive. Each knock sends a shudder across the comb. An assault stacks
    knocks faster than the colony can settle. At the diary''s closing hour the umpire drapes the hive
    in black crepe and the projector is switched off. Nothing is kept.'
  rationale: Telling the bees was how rural households registered a death, so the custom fits the job,
    and unlike a reading of names it cannot be scripted. A colony's alarm builds and decays on its own
    biology. A run of casualties leaves the hive roaring long after the dice go quiet, and neither the
    umpire nor the artist can stage it or stop it. A commander learns that an order killed men from a
    sound that will not settle, not from a theme he was told in advance. The audience watching the comb
    sees the war only as the disturbance it causes. That works as cinema because the footage exists only
    in the hour it is made.
  card_readings:
  - card: real-time-only
    interpretation: The game, the hive feed and the projection run on a 1:1 clock against the historical
      engagement's start and end hours, with no pause, no replay and no recording, and the show ends when
      the real fighting stopped.
  - card: kriegsspiel
    interpretation: 'The literal 1824 Prussian wargame: a terrain map with unit blocks, commanders kept
      apart and sending written orders, and an umpire whose casualty dice decide losses and who alone
      tells the players what happened.'
  - card: beekeeping
    interpretation: A real glass observation hive and the English beekeepers' custom of telling the bees
      of a death and draping the hive in black crepe.
