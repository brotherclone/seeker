    interpretation: 'Thomas Wilfred''s actual Clavilux, rebuilt from his patent drawings: a lamp, reflectors,
      gels and a console playing slow projected lumia, his ''eighth art'' of light composed live.'
  - card: beekeeping
    interpretation: A real glass observation hive with its waggle dance, and a beekeeper's sugar-feeder
      trial at a set bearing, used as the experiment von Frisch ran with a lamp.
