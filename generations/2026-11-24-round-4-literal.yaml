- position: 8
  statement: A one-take, live-streamed, never-archived film of a parish's memorial battle re-fought as
    Kriegsspiel at 1:1 time, each block hiding a soldier's real probate entry, where an on-camera accountant
    computes and stamps EXEMPT the estate duty forgiven a man killed on active service, because commanders
    learn whom they killed only from the tax relief slip.
  subject: A single-take, live-streamed, unarchived film of an 1824-style Kriegsspiel table where an accountant
    sits in frame beside the umpire
  behavior: 'A parish''s memorial engagement, chosen because its battalion war diary fixes zero hour and
    the end of the action, is re-fought freely on an 1824-style map table at 1:1 time and filmed in one
    unedited take that streams live to a cinema and is never archived. Before play, each unit block gets
    one memorial-roll man''s probate calendar entry fixed to its underside: his name, parish and ''Effects
    £'' figure. The two commanders sit in separate rooms with no briefing beyond the Kriegsspiel rules.
    They send written orders by runner. When the umpire''s dice strike a block, he turns it over and passes
    the entry to an accountant seated in frame. On a period estate-duty form, the accountant works out
    the duty that would have been owed, then crosses it to nil under the wartime exemption for men killed
    on active service and stamps it EXEMPT. The commanders get no other casualty report. A runner hands
    them the stamped carbon. They learn whom their order killed from a figure like £7 3s 2d and a tax
    relief. The camera never cuts. At the diary''s closing hour the stream ends mid-calculation.'
  rationale: Kriegsspiel already turned death into an umpire's arithmetic. The estate-duty exemption is
    the one place the state formally priced each soldier's death, and it offered its condolence as a waived
    tax bill. When the exemption slip becomes the commander's only casualty report, nothing is announced.
    A commander reads a dead man's whole worldly worth, often a few pounds, at the moment the state forgives
    it. The order that caused it is still in his hand. Probate calendar entries and WO 95 war diaries
    are public and in English, so one person can source everything. The single live take keeps the accountant's
    slow, exact arithmetic at the same pace as the fighting.
  card_readings:
  - card: real-time-only
    interpretation: The battle is re-fought and filmed in one continuous take at 1:1 time between the
      war diary's start and end hours, streamed live once, never edited or archived.
  - card: kriegsspiel
    interpretation: 'The literal 1824 Prussian wargame: a map table with unit blocks, commanders kept
      apart and sending written orders by runner, and an umpire whose dice decide losses.'
  - card: tax-law
    interpretation: The actual estate-duty code and its wartime exemption for men killed on active service
      (still law as IHTA 1984 s.154), applied on camera to each struck man's real probate value.
