- position: 10
  statement: A single-take film of a literal 1824 Kriegsspiel whose master map is the glass face of an
    observation hive during a nectar flow, because bees draw and cap comb at their own pace, turning open
    ground into woods beneath the blocks, so the camera shows armies stranded by terrain growing in real
    time.
  subject: A single-take, real-time film of a Kriegsspiel umpire's master map, which is the glass face
    of a working observation hive with the unit blocks set on the glass.
  behavior: 'Two commanders in separate rooms play Reisswitz''s 1824 rules, as written in Leeson''s translation,
    with the umpire''s sketches as their only view. The master map is the living face of a glass observation
    hive during a nectar flow. The umpire reads each cell type as 1824 terrain: capped honey is woods,
    open brood is marsh, and drawn-but-empty comb is open ground. He sets the brass unit blocks on the
    outside of the glass with micro-suction tape and moves them at the rule''s pace. A fixed camera films
    the glass in one unbroken take, from the first forager out to dusk. As the bees draw and cap comb
    in real time, the terrain under each block changes. A battalion parked on open ground at ten is standing
    in forest by three, and a road the bees fill with nectar closes behind the troops using it. No re-drawing
    is allowed, and the game ends when the camera loses the light.'
  rationale: Reisswitz's innovation was fighting on real, measured terrain. Here the terrain is alive
    and rebuilt by a colony that ignores both armies. The camera puts the bees and the blocks in the same
    frame, so viewers watch actual cells change under actual units. That change is too slow to notice
    in any clip and only becomes legible over hours of unbroken real time.
  card_readings:
  - card: real-time-only
    interpretation: Game moves, the single uncut take and the bees' comb-building all run on one 1:1 clock
      from first forager to dusk, with no pause and no second take.
