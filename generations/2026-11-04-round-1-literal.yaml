  statement: A wall projection of Ben-Day-dot comic panels that datamoshes itself whenever a single distance
    sensor detects a viewer leaning in, because halftone printing and video codecs are both compression
    tricks that only cohere from afar, and closeness should expose the cheat.
  subject: A wall projection of slowly panning Ben-Day-dot comic panels driven by a Raspberry Pi and a
    single ultrasonic sensor
  behavior: Plays a loop of Ben-Day-dot comic panels from a Raspberry Pi whose one ultrasonic distance
    sensor tracks the nearest viewer. As someone steps close to inspect the dots, the Pi drops I-frames
    from the stream, so the dots smear along stale motion vectors. Stepping back lets the next keyframe
    snap the clean panel back into place.
  rationale: Ben-Day printing and video compression are both economies that send the eye less information
    than it thinks it sees, and both only hold together at a distance. Tying the glitch to proximity makes
    the viewer's urge to look closer the very thing that exposes the trick, where the halftone grid and
    the macroblock grid collide.
  card_readings:
  - card: single-sensor
    interpretation: One HC-SR04 ultrasonic distance sensor is the only input. Viewer proximity is all
      the piece knows.
  - card: datamoshing
    interpretation: I-frame removal on a pre-encoded H.264 stream, toggled live, so P-frame motion vectors
      drag the dot pattern across the panel.
  - card: ben-day-dots
    interpretation: The source footage is slowly panning comic panels printed in hand-registered Ben-Day
