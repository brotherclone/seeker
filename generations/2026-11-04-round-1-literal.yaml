      finished poem.
  - card: erasure
    interpretation: Erasure poetry made literally, by destroying the source text and leaving only selected
      words to carry the poem.
  - card: vhs-tape
    interpretation: A physical videocassette of found broadcast TV, used as both the source text and the
      surface that gets blacked out.
