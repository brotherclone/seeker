  statement: A one-take live recording of a regional railway timetable played on a used DX7 that sets
    each line's FM operator ratio from its headway and rides dwell times on the index faders, because
    clock-face timetables are built from integer intervals, so well-timed connections ring harmonic and
    schedule conflicts turn clangorous.
  subject: A one-take live performance of a regional railway timetable played on a used DX7
  behavior: Plays a regional railway timetable live as a one-hour compressed day. Each line is a two-operator
    FM voice whose modulator:carrier ratio comes from its service headway. The performer rides each modulation
    index up as a train dwells in a station. The whole thing is recorded in one unedited take, with missed
    cues left in.
  rationale: Clock-face timetables are built from integer headways (15, 30, 60 minutes) so that connections
    line up at junctions. FM's timbre depends sharply on whether its ratios are simple integers. Coordinated
    connections therefore ring out as harmonic chords, while off-pattern freight paths and delays turn
    audibly clangorous. The one-take rule keeps the timetable's own unforgiving logic intact.
  card_readings:
  - card: one-take
    interpretation: The piece is recorded in a single continuous unedited take, and a missed departure
      stays missed, as it would on a real railway.
  - card: fm-synthesis
    interpretation: Each rail line is a two-operator FM voice on a used DX7, with its frequency ratio
      set by the line's headway and its modulation index ridden by hand on faders.
  - card: railroad-timetables
    interpretation: An actual printed clock-face timetable, such as a Swiss Taktfahrplan, is read as the
      score, with departures, dwell times and headways driving the sound.
