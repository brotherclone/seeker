  subject: A single-color risograph comic that doubles as a graphic score for a granular-synthesis patch
  behavior: 'Tells a wordless story of one oak, one panel per tree-ring year from a real measured core
    sequence. Each panel''s width equals that year''s ring width. Each panel also scores the soundtrack:
