  statement: An erasure poem made on a found VHS soap opera that records black and silence over everything
    except chosen spoken phrases, keeping at most eight characters' voices, because tape overwriting is
    a one-way cut and an eight-voice cast lets listeners follow the poem as a dialogue.
  subject: An erasure poem made on a found, home-taped VHS cassette of a soap opera
  behavior: Overwrites everything on a thrifted, home-recorded VHS soap opera with black and silence,
    using a second VCR in record mode, except the spoken phrases that form a poem. No more than eight
    distinct characters' voices may survive, so the result plays back as a short spoken octet among the
    static.
  rationale: Recording over tape is as destructive and linear as a marker on a page. Each crash edit leaves
    a visible rainbow seam where the cut was made. Capping the cast at eight voices keeps the poem followable
    by ear as a conversation between recognizable speakers rather than a collage of stray sound bites.
  card_readings:
  - card: eight-voices-max
