  rationale: 'Tree rings and grain clouds encode a long signal the same way: as a stream of tiny dated
    units whose widths carry the conditions of their moment. Restricting the print to one ink makes darkness
    the single value the scanner reads. That is also how a dendrochronologist reads a core, light earlywood
    against dark latewood, so the page works both as a comic and as an unambiguous score.'
