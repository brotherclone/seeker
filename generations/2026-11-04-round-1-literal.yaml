  statement: A gloved-hand hive stethoscope that maps one nanoKONTROL2 knob to a narrow bandpass sweep
    over an in-hive contact mic, letting a beekeeper dial through the colony's hum to hear swarm piping
    or queenless roar, because those states live in specific frequency bands and listening beats cracking
    the lid and chilling the brood.
  subject: 'A one-knob hive stethoscope: a Teensy USB-host box driven by a nanoKONTROL2 and fed by an
    in-hive contact mic.'
  behavior: A Teensy 4.1 reads a single knob's CC from a nanoKONTROL2 over USB host and sweeps a narrow
    digital bandpass filter from 100 to 1000 Hz across a contact-mic feed from inside a hive, sending
    the result to headphones so the beekeeper can tune in to queen piping, quacking or the queenless roar.
  rationale: Swarm preparation and queenlessness each have distinct narrowband acoustic signatures. Queen
    piping sits roughly at 400–500 Hz. A single sweepable band lets an ear trained by repetition pick
    these out from the broadband hum without opening the box. Opening the box chills the brood and agitates
    the colony. One knob also works through gloves and a veil.
  card_readings:
  - card: one-knob
    interpretation: The instrument has exactly one control, a filter-center sweep. The nanoKONTROL2's
      other knobs, faders and buttons are taped over and ignored in firmware.
  - card: nanokontrol2-mapping
    interpretation: 'A literal MIDI mapping: knob 1''s CC number on the KORG nanoKONTROL2 is mapped to
      the bandpass center frequency in the Teensy''s USB-host MIDI handler.'
  - card: beekeeping
    interpretation: Apiculture is the use case. A contact mic is wedged between brood frames to capture
