- position: 4
  statement: A camera obscura tent where a herald blazons each stranger crossing the live projected street
    as a coat of arms, granted aloud and never written, until dusk erases tinctures and the last arms
    are 'sable, plain', because heraldry was invented to identify faceless strangers by colour and device,
    which is exactly all the obscura shows.
  subject: A portable camera obscura tent used as a dusk heralds' court that grants spoken, unrecorded
    arms to passersby
  behavior: 'From late afternoon until dark, a herald works in a blackout tent. Rotating a lens turret
    across the street, they blazon every stranger who enters the projected circle as a coat of arms, in
    correct heraldic language: ''Per pale azure and gules, a bicycle Or, in chief a dog courant sable.''
    Coat colors become tinctures, carried objects become charges, and direction of travel becomes dexter
    or sinister. The herald corrects aloud for the obscura''s inversion. Visitors on benches act as the
    heralds'' court and repeat each blazon once, so it is granted. Nothing is drawn, written or recorded,
    and each grant exists only for as long as it is spoken. As dusk drains colour from the table, the
    herald loses tinctures one by one. Gules goes first, then vert and azure, and soon only metal and
    sable can be told apart. The last grant is ''sable, plain'', for whoever crosses when no colour remains,
    and then the tent is closed.'
  rationale: 'Heraldry was invented to identify people whose faces were hidden, such as armoured riders
    recognised at a distance only by colour and device. The obscura gives exactly that view: tiny faceless
    figures, upside down, readable only by their coats, bags and bikes. So the herald is not putting a
    quirky label on them. They are doing what blazon was built for, applied to commoners who never asked
    to be noticed and will never learn they were ennobled. Blazon also needs specific detail, so a generic
    ''figure crossing'' cannot be blazoned. Its dependence on colour gives the evening a real ending,
    because the rule of tincture fails as the light fails. The edge from the parent stays sharp. A coat
    of arms is a tool for identifying strangers, which makes it surveillance and honour at the same moment.'
  card_readings:
  - card: real-time-only
    interpretation: Each arms grant is spoken once over a live image that cannot be recorded, so the roll
      of arms exists only during the performance and ends when the light can no longer show colour.
  - card: camera-obscura
    interpretation: A portable blackout tent with a meniscus lens and a 45° mirror turret, throwing the
      live street onto a white table. The image is inverted, and the herald must right it in order to
      blazon dexter and sinister correctly.
  - card: heraldry
    interpretation: Literal blazon, the formal language of tinctures, ordinaries and charges, used by
      a herald to grant arms aloud to strangers on the street.
