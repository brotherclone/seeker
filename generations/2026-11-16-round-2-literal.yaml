  statement: A one-ink photocopied comic of a churchyard drawn year by year from its living oak's cross-dated
    core, performed under a document camera with grain clouds built from that year's spoken burial names,
    because famine years narrow the rings and fill the register at once, so the tree's record and the
    parish's dead meet on one page.
  subject: A one-ink photocopied comic about a churchyard, performed as a live reading, whose panels are
    sized by its living oak's cored rings and scored with granulated burial names
  behavior: 'A black-toner photocopied comic, one wordless panel per year, shows the same churchyard from
    the tree''s height: graves accumulate, stones lean, the wall is rebuilt. Each panel''s width is the
    measured width of that year''s ring in a core taken with a hand increment borer from the churchyard''s
    oak and cross-dated against a public regional chronology. At a live reading the artist turns pages
    under a document camera. A Pure Data patch measures each panel''s toner coverage and plays grain clouds
    cut only from the artist''s own recording of that year''s burial entries read aloud from the parish
    register. Coverage sets grain density, and panel width sets how long the year lasts. In famine and
    drought years the panels pinch narrow while the names pile up, so a crowded, smeared murmur gets crammed
    into a sliver of time.'
  rationale: 'Rings and burials are independent archives that share one cause: the same bad summer that
    starved the oak starved the parish. So when they line up, the alignment is evidence turning up on
    the page, not a mapping the artist built for effect. The tree is cored, not felled, so it still stands
    and keeps adding rings over its neighbours, and you can walk out and visit it. One ink, a borer and
    a photocopier keep the whole thing in one person''s hands.'
  card_readings:
  - card: one-color
    interpretation: Printed only in black photocopier toner on cream paper, so ink coverage is the single
      value the patch measures from each panel.
  - card: granular-synthesis
    interpretation: 'Real granulation: a Pure Data engine cuts the spoken burial names for each year into
