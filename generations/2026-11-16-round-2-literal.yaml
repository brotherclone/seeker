- position: 11
  statement: A wordless hand-drawn stop-motion map of a village drowned by a reservoir, projection-mapped
    onto a cut-card contour model of its valley, which floods layer by layer up to the real waterline,
    because plan-view roads draped over surveyed relief show the terrain the flat drawing hid and mark
    exactly which lanes lie underwater.
  subject: A wordless hand-drawn stop-motion map of a drowned village, projection-mapped onto a cut-card
    contour model of its valley built from the old survey
  behavior: The animator cuts a stepped contour model of a real valley from the pre-flood survey, one
    layer of card per contour interval, and paints it matte white. A wordless hand-drawn stop-motion film
    is projection-mapped onto it. First comes a legend made only of line weights. Then the village's roads,
    field boundaries and houses are drawn in plan view, frame by frame. Projected flat, the lines bend
    over the stepped hills. In the closing sequence a hand-inked water tint fills the model one layer
    at a time and stops at the contour that matches today's reservoir level. Only the hilltop lanes stay
    lit.
  rationale: The parent needed sound to supply the elevation its flat drawing could not show. Here projection
    mapping lets the survey's own contours carry that elevation as a physical surface, so the plan-view
    drawing and the terrain finally sit in one image. The reservoir line is a real contour, so the audience
    sees exactly which roads drowned, with no words needed.
  card_readings:
  - card: no-dialogue
    interpretation: No spoken or written words anywhere. Even the legend is only line weights, and the
      flooding is told by colour climbing the contours.
  - card: projection-mapping
    interpretation: 'Literal video mapping: the film is projected and aligned onto a physical stepped
      relief model rather than a flat screen.'
  - card: cartography
    interpretation: 'Real survey conventions: plan-view roads as polylines, line weight for road class,
      a wordless legend, and contour intervals cut as physical layers.'
