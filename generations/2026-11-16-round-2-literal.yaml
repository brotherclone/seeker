- position: 14
  statement: A one-ink risograph comic whose panel widths follow a real oak's cross-dated ring-width series
    and whose scanned pages drive a granular-synthesis patch, turning each year into a grain cloud, because
    rings and grains both store time as thin measured slices and single-color ink gives the scanner one
    clean density value, as a core sample does.
  subject: A single-color risograph comic that doubles as a graphic score for a granular-synthesis patch
  behavior: 'Tells a wordless story of one oak, one panel per tree-ring year from a real measured core
    sequence. Each panel''s width equals that year''s ring width. Each panel also scores the soundtrack:
    a small Pure Data grain engine reads the scanned page so that panel width sets grain duration and
    ink coverage sets grain density. Drought years become cramped, sparse crackles and wet years become
    wide, dense clouds.'
  rationale: 'Tree rings and grain clouds encode a long signal the same way: as a stream of tiny dated
    units whose widths carry the conditions of their moment. Restricting the print to one ink makes darkness
    the single value the scanner reads. That is also how a dendrochronologist reads a core, light earlywood
    against dark latewood, so the page works both as a comic and as an unambiguous score.'
  card_readings:
  - card: one-color
    interpretation: The whole comic is printed in a single black ink on cream stock, so ink coverage is
      the only visual variable.
  - card: granular-synthesis
    interpretation: 'Actual microsound: a Pure Data patch slices a field recording of wind in oak leaves
      into grains whose duration and density are driven by each scanned panel.'
  - card: dendrochronology
    interpretation: 'Real tree-ring dating: panel widths come from a published, cross-dated oak ring-width
      series, so the page grid is the tree''s chronology.'
