  subject: A wordless landscape film whose locations and shot lengths come from a Standard MIDI File of
    a folk tune collected in the region it crosses
  behavior: Takes a Standard MIDI File of a folk tune collected in a particular region and lays it over
    the Ordnance Survey sheet that covers that region. Each note-on tick sets an easting across the sheet,
    and each pitch sets a northing within the sheet's range. The filmmaker travels to every resulting
    grid reference and shoots one locked-off, wordless shot facing along the route. Each shot lasts as
    long as its note, timed from the file played at a slowed tempo. The shots are cut in note order, and
    the film is screened while the same slowed file plays, so every cut falls on a note change.
  rationale: The image is no longer a graph of the music. It is real ground that the music chose and no
    editor would pick. The gap between a familiar melody and the plain land it lands on is what the viewer
    feels. The return of the tune to its own valleys is the reveal, discovered slowly and never explained.
  card_readings:
  - card: no-dialogue
    interpretation: No speech, captions or title cards; the only sound is the tune, and the only image
      is still landscape shots.
  - card: midi-file
    interpretation: 'A literal Standard MIDI File of the tune: note pitches are read as northings and
      note-on ticks as eastings, each note''s length in ticks sets its shot''s length, and at the screening
