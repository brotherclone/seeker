- position: 13
  statement: A camera obscura tent-chapel that screens the live street as a film service, with a written
    order of call and response triggered by passersby, because a projection that cannot be recorded needs
    a ritual form to turn unrepeatable light into a shared event.
  subject: A portable camera obscura tent-chapel, staged as a one-person live cinema service
  behavior: 'Runs a printed order of service whose calls are events in the live projected street, such
    as a figure crossing or the light dimming, and whose responses are spoken aloud by the seated congregation.
    A lone officiant turns a mirror-and-lens turret between fixed movements: processional, reading, silence,
    dismissal.'
  rationale: 'A camera obscura is cinema that cannot be edited or kept. A liturgy is a script built for
    exactly that condition: it gives fixed form to an unrepeatable present. Binding responses to chance
    events trains the audience to attend to unstaged reality the way a congregation attends to a rite,
    and the result is a film made of attention rather than footage.'
  card_readings:
  - card: real-time-only
    interpretation: 'Nothing is recorded or replayed: the only image is light passing through the lens
      now, and the work ends when the light does.'
  - card: camera-obscura
    interpretation: A literal blackout tent with a rotating lens turret that projects the outside world,
      upside down and live, onto a white table.
  - card: liturgy
    interpretation: A fixed ritual order of service with call and response, where the projected world
      gives the call and the audience answers.
