- position: 15
  statement: A wordless stop-motion short in which a pen plotter draws a map translated from a Standard
    MIDI File, filmed frame by frame and screened against that file's playback, because the file is already
    a time-stamped coordinate list, so one artifact yields both the image and a perfectly synced score.
  subject: A wordless stop-motion short film of a map being drawn by a pen plotter
  behavior: Converts one Standard MIDI File into a pen-plotted map, with each track as a road, pitch as
    north-south position, ticks as east-west distance and velocity as line weight. The map is shot stop-motion
    as the plotter draws it, and the result is projected in sync with the same file played on a General
    MIDI synth.
  rationale: An SMF is already a list of time-stamped coordinates, the same structure as a surveyed route.
    One file can therefore generate both the picture and the score with frame-exact sync and no hand-timing.
    With dialogue removed, the viewer hears the terrain before seeing it drawn, and learns to read the
    map by ear.
  card_readings:
  - card: no-dialogue
    interpretation: The film has no spoken or written words; meaning comes only from the drawn line and
      the music.
  - card: midi-file
    interpretation: A literal Standard MIDI File, parsed for its tracks, note pitches, velocities and
      tick timestamps.
  - card: cartography
    interpretation: 'Actual mapmaking conventions: roads as polylines, line weight as road class, a legend,
      and the slow reveal of a territory.'
