- position: 7
  statement: A black-toner photocopied comic that tells a felled oak's life backward, one flow-field-drawn
    panel per cross-dated ring year, where every streamline in every panel breaks against the same blank
    saw kerf, because the felling cut crosses all the rings at once and is what makes each year legible,
    so the death belongs to every year.
  subject: A wordless black-toner photocopied comic about a felled oak, drawn entirely as generative flow
    fields
  behavior: 'Read from the saw cut back to the seedling, one wordless panel per year. Each panel''s width
    comes from a published cross-dated oak ring-width series. Its whole image is a flow-field drawing:
    a Python script traces streamlines through a noise field seeded by that year''s date, and the ring
    index sets line count and length. Wide wet years fill the panel with long, dense, crowded strokes.
    Drought years leave a few short, stalled ones. The streamlines loosely gather into that year''s crown,
    weather and ground. Every streamline in every panel stops dead at one blank horizontal band at the
    same height on every page: the saw kerf. The SVGs are printed straight to black toner on cream stock
    on any photocopier.'
  rationale: In dendrochronology the felling cut is not one event at the end of the series. It is a plane
    that passes through every ring at once, and it is the reason any ring can be read at all. A flow field
    makes that physical. A blank band that every streamline must break against puts the death inside the
    seedling's year as much as the last one, so the wound is everywhere rather than at the end. This keeps
    the debate's hard-won ache and the backward reading, and drops the scanner and audio pipeline that
    were only ever an illustration of the data.
  card_readings:
  - card: one-color
    interpretation: Black photocopier toner on cream stock only, so line density is the sole carrier of
      each year's growth and the kerf can only be shown as absence of ink.
  - card: flow-fields
    interpretation: 'Generative vector-field drawing: a coded noise field whose traced streamlines make
      up every image in every panel, with line count and length driven by data.'
  - card: dendrochronology
    interpretation: A real cross-dated oak ring-width series from the ITRDB sets panel widths and streamline
      density, and the felling cut is the transverse section through which every ring is read.
