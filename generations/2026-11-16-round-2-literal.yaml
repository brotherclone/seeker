  statement: A black-toner photocopied comic that draws one afternoon ten times, each page inked from
    a successive archived forecast for it, while a grain engine built only from that day's spoken radio
    forecast condenses from cloud into words as lead time shrinks, because a forecast is a story the sky
    hasn't agreed to yet.
  subject: A wordless black-toner photocopied comic that is also the score for a granular patch built
    from a single recorded NOAA Weather Radio forecast
  behavior: 'Each page draws the same twelve-panel afternoon on the same street, inked from successive
    archived forecasts for one chosen date, issued ten days out, then nine, and so on down to one. Black
    coverage in each panel follows the forecast cloud cover for that hour. The figure''s outline is drawn
    once per GEFS ensemble member, so far-out pages show a crowd of ghost outlines that converge into
    one person as the date approaches. A Pure Data grain engine reads the scans and uses only one source:
    a NOAA Weather Radio broadcast for that afternoon, recorded off a cheap receiver. Panel ink sets grain
    density, and ensemble spread sets grain position jitter and pitch scatter. The early pages are hiss
    and cloud, and words begin to surface around day three. The last page is inked from the METAR observations
    of what actually happened, and it plays the broadcast whole. Printed in black toner on any photocopier.'
  rationale: A forecast is a story about a day that does not exist yet, and its uncertainty shrinks in
    a measurable way as the day approaches. The mapping makes that shrinking literal. The ensemble spread
    scatters both the drawn figure and the spoken grains, so the reader watches a person and hears a voice
    come into focus out of weather noise. On the final page the intact sentence can be heard contradicting
    the sky that is actually drawn. Black toner keeps cloud as the one value the scanner reads. Every
    input is a free public download or a cheap off-air recording.
  card_readings:
  - card: one-color
    interpretation: A single black toner on cream paper, so ink coverage stands for cloud cover and is
      the only value the scanner reads.
  - card: granular-synthesis
    interpretation: 'Real microsound: a Pure Data patch granulates one recorded radio forecast, with the
      scanned panels setting grain density and scatter.'
  - card: weather-forecasting
    interpretation: 'Actual numerical weather prediction: archived GFS/GEFS forecasts at several lead
      times for one place and hour, checked against METAR observations.'
