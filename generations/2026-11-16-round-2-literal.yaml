    unrecorded and unrecoverable.
  subject: A blacked-out shed made into a camera obscura with fifteen pinholes, used for a Holy Week Tenebrae
    service
  behavior: Fifteen pinholes in a blacked-out shed wall each throw a live, inverted view onto the opposite
    white wall. The Tenebrae lessons and responsories are chanted, and after each psalm one pinhole is
    plugged, so the projected world thins view by view while the street carries on. When the last image
    goes, the congregation makes the strepitus, a loud knocking in total darkness. Then one pinhole is
    unplugged and the street returns.
  rationale: The parent was faulted for using liturgy as a call-and-response scaffold. Tenebrae carries
    its own charge, abandonment and the light withdrawn, and here it acts on the image itself instead
    of using the street as cues. The pinholes replace the candles, so each extinction cuts off a live
