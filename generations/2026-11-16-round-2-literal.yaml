- position: 12
  statement: A wordless hand-drawn stop-motion film in which a real Georgian street's windows are bricked
    up one by one, while a self-playing piano plays a MIDI file built from the window tax's rate schedule,
    because the ear hears the law tightening as the eye watches houses go blind, with no words to connect
    them.
  subject: A wordless hand-drawn stop-motion short about the English window tax, scored by a MIDI file
    built from the tax's actual rate schedule
  behavior: 'Encodes the English window tax schedule from 1696 to 1851 as one Standard MIDI File. Each
    tax year is one bar. Each window-count band in force that year sounds as a note: the band''s threshold
    sets the pitch, and the rate per window sets the velocity. Pitt''s 1797 tripling therefore lands as
    thick, hammered chords, and the 1851 repeal falls silent. The animator draws a real surviving street
    of Georgian houses and, frame by frame, bricks up its windows by hand. The frame for each brick comes
    from a table computed from the file''s ticks. The film is screened with no titles or captions while
    the file plays on a self-playing piano.'
  rationale: 'As in the parent, the source is a real record, and picture and sound carry different halves
    of it. The piano plays the statute''s numbers, and the drawing shows what people did in response.
    The viewer works out cause and effect alone, because no narrator links them. A tax code is normally
    pure text, so taking the words away makes the law audible and its consequences visible: rooms going
    dark as the chords grow heavier.'
  card_readings:
  - card: no-dialogue
    interpretation: No speech, captions, dates or quoted statute; the law is carried only by the piano
      and the drawn bricks.
  - card: midi-file
    interpretation: A literal Standard MIDI File in which bars are tax years, pitch is the window-count
      threshold, velocity is the rate, and ticks drive the stop-motion frame table.
  - card: tax-law
    interpretation: The actual English window tax statutes and their amendments from 1696 to 1851, with
      bands, rates and the repeal.
