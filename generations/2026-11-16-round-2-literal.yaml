  statement: A wordless film that turns a Standard MIDI File of a local folk tune into Ordnance Survey
    grid references and shoots one held landscape shot at each point, each shot lasting its note's length,
    because the tune's contour sends the camera to ordinary fields and lay-bys no one would choose to
