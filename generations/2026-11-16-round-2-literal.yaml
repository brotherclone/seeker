  statement: A set of loose black-toner comic strips, each a timber's wordless life with panels sized
    to its rings, that readers cross-date by sliding them under a webcam until a granulated rain recording
    falls silent on every strip at once, because a dendrochronological date exists only where many trees
    agree on the same drought.
  subject: A loose-strip, black-toner photocopied comic that readers cross-date by hand on a table, sonified
    by a granular rain patch
  behavior: Six undated strips of wordless panels, each the life of one timber from a single old building,
    use panel widths set by real ITRDB ring series. Narrow drought years are drawn as nearly solid black
    panels. Readers slide the strips on a table under an overhead webcam. A Pure Data patch granulates
    one rain recording per strip, with ink density thinning that strip's grain cloud. Out of alignment,
    the dry gaps smear into a continuous patter. When the strips are cross-dated correctly, every strip's
    drought panels stack, and the rain stops everywhere at once for a few beats.
  rationale: 'In dendrochronology no single tree holds its own date. The date exists only where many trees
    agree, usually on the hard years. Making the reader perform that matching turns the mapping from a
    predictable playback into a discovery. The reward for solving it is a shared silence: the year every
    tree nearly died, found by ear rather than handed over.'
  card_readings:
  - card: one-color
    interpretation: Black toner on cream only, so ink density is the single value the webcam reads and
      drought years show as the blackest panels.
  - card: granular-synthesis
    interpretation: A Pure Data patch slices a single rain recording into grain clouds per strip, and
      dark panels starve the cloud of grains.
  - card: dendrochronology
    interpretation: 'Real cross-dating: undated timber ring series are matched by sliding their narrow-year
      patterns against each other, as with skeleton plots.'
