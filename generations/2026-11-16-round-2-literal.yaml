- position: 10
  statement: A wordless short film following one walker along an unrecorded footpath, scored by the MIDI
    file her footsteps write as she paces it, because pace-and-bearing surveying needs only step timing
    and compass direction, which an SMF stores natively, so the score doubles as the field book from which
    the lost path is finally redrawn on the map.
  subject: A wordless short film of one walker resurveying an unrecorded footpath, scored by the MIDI
    file her own steps write
  behavior: A walker retraces a footpath missing from the official map. A shoe switch and a compass module
    feed a pocket logger that writes a Standard MIDI File. Each footfall is a note, quantised compass
    bearing is pitch, and footfall force is velocity. The film is shot handheld and wordless, cut to the
    file played back on piano. In the closing shot the walker plots the path from the file onto tracing
    paper laid over the printed map.
  rationale: 'Pace-and-bearing is a real survey method, and an SMF records exactly what it needs: a step
    count, a direction and a time. The score is therefore the field book itself, not a graph replotted
    as music. Because it records a body rather than a chart, it carries what a machine would not. Stalls
    at blocked stiles become silences, and detours around fences become pitch swerves. The audible gap
    between the old route and where a person could actually go is the film''s feeling.'
  card_readings:
  - card: no-dialogue
    interpretation: No speech or text appears anywhere; the claim for the path is made only by the walk,
      its sound and the drawn line.
  - card: midi-file
    interpretation: 'A literal Standard MIDI File written live by a logger during the walk: tick timestamps
      are footfalls, note pitch is compass bearing, velocity is step force.'
  - card: cartography
    interpretation: 'Actual survey practice: pace-and-bearing dead reckoning, a field book, and plotting
      a route onto an Ordnance Survey sheet.'
