  statement: A street-facing camera obscura whose viewing table is masked by a cut Cardan grille, so that
    letters from the live, inverted shop signs opposite spell a hidden sentence that passing traffic keeps
    erasing, because the message's key is the town as it stands right now, and so it can be visited but
    never copied.
  subject: A fixed street-facing camera obscura whose viewing table is masked by a hand-cut Cardan cipher
    grille
  behavior: A light-tight box with a single fixed lens sits in a rented front room facing a high street
    and is focused on the shop fronts opposite. A black card grille lies on its white viewing table. The
    builder has cut the grille's holes, by tracing the inverted image, exactly where single letters of
    the signs, bus-stop timetable, house numbers and posters fall. One visitor at a time puts their head
    under the hood and sees mostly black. Through the holes, letters from the live, upside-down street
    spell a sentence. A passing van, a lowered shutter or a pedestrian in front of a sign drops letters
    out mid-read, so the sentence flickers between sense and gibberish. Nothing is projected anywhere
    else or recorded. When a shop repaints its sign, that grille's message dies, and the builder retires
    the card.
  rationale: A Cardan grille hides a message inside innocent text, and this one hides it inside the town
    itself. The key is the box's exact position plus the grille, so a photograph of the street reveals
    nothing. The message cannot be copied, only visited. Strangers walking past unknowingly censor it.
    It expires the day the street changes, which makes it a film that exists only as projection.
  card_readings:
  - card: real-time-only
    interpretation: The plaintext exists only in the light passing through the lens at that moment. Traffic,
      shutters and passers-by edit it live, and nothing is filmed or kept.
  - card: camera-obscura
    interpretation: A literal fixed box obscura with one long lens throwing the street opposite, inverted,
      onto a white table under a viewing hood.
  - card: cryptography
    interpretation: A Cardan grille, the historical stencil cipher that picks hidden letters out of an
      innocent cover text. Here the cover text is the street itself.
