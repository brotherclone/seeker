  subject: A nine-and-a-half-hour single-take film of a Kriegsspiel played in a side chapel of a working
    cathedral during its ordinary daily services
  behavior: 'Two players re-fight Waterloo on an 1824 map table in a side chapel of a working cathedral.
    The game runs at 1:1 time from 11:30 to 21:00 on the 18 June anniversary. One rule binds them: when
    the bell rings for the Eucharist or Evensong, both must leave the table and attend. The umpire keeps
    the clock running and adjudicates their last written standing orders, rolling casualty dice at the
    empty table. A single locked-off camera films the whole nine and a half hours in one unbroken take.
    Chant from the quire carries over the dice, and the players come back to find units gone. The worshippers
    are never told, and the cathedral''s ordinary schedule of services is left unaltered.'
  rationale: 'Kriegsspiel was built to teach that command means writing orders and then being absent while
    they play out. Here the absence is imposed by a liturgy the piece does not control and cannot reschedule,
    so it is not a staged ceremony. The congregation is not performing for anyone, and the players cannot
    prepare for it. Complicity reaches each player when they return to a board that changed while they
    knelt. The viewer sees it concretely: an untouched table, and dice falling under a Magnificat that
    was never meant for it.'
