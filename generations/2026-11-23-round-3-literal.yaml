- position: 6
  statement: A Tenebrae service in a lensed, blacked-out chapel where each candle snuffed between psalms
    lets the inverted living street surface more clearly on a sheet behind the altar, until sunset takes
    it back, because the liturgy's own darkening becomes the projector's exposure, so the darkness that
    stands for abandonment reveals the indifferent living city.
  subject: A Tenebrae service held inside a single-lens camera obscura chapel
  behavior: 'On a Holy Week evening, Tenebrae is sung in a small chapel or hired hall. One window is blacked
    out and fitted with a single lens. It throws the street outside, upside down, onto a linen sheet hung
    behind the hearse, the triangular stand of fifteen candles. At first the candlelight washes the image
    out completely. After each psalm and its sung responsory, one candle is snuffed. The street rises
    out of the sheet a little more each time: buses, umbrellas and lit shop signs, all inverted and passing
    silently over the readings from Lamentations. The service starts at a set time before sunset. That
    means the dying candles race the dying daylight, and the picture is brightest for only a few minutes
    somewhere in the middle of the office. After that, dusk takes it away again. The last candle is hidden.
    The congregation makes the strepitus, slamming books on the pews, and leaves in darkness. Nothing
    is filmed, and no two nights look alike.'
  rationale: Tenebrae already is a rite of controlled darkening, and a camera obscura works only in the
    dark. So the liturgy's own order of service becomes the projector's exposure control, and no prop
    has to illustrate a moral. The darkness that stands for abandonment is what reveals the living city.
    That city is upside down and indifferent, and nobody can step out of the image the way a cinema audience
    can step out of a film. The image fades for real when dusk wins, so the piece gets under the skin
    rather than confirming what anyone already knew.
  card_readings:
  - card: real-time-only
    interpretation: The only image is the live street, and its brightness depends on the timed race between
      snuffed candles and actual sunset, so each performance's picture happens once and is never kept.
  - card: camera-obscura
    interpretation: A single lens in a blacked-out chapel window projects the inverted street onto a linen
      sheet behind the altar, the classic room-sized obscura.
  - card: liturgy
    interpretation: The Tenebrae office, with its psalms, sung responsories, candles snuffed one by one
      on the hearse, and the closing strepitus in the dark.
