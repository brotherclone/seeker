- position: 7
  statement: A Rogationtide live-cinema rite in which hidden players run Lizzie Magie's Landlord's Game
    on a board redrawn from the parish tithe map, camera fed straight to projector, while the hall answers
    every rent paid with the Commination's 'Amen', standing when it is their own house, because Magie's
    argument about land becomes a verdict spoken once and never kept.
  subject: A live-projected, unrecorded Rogationtide performance of Lizzie Magie's Landlord's Game, played
    on the parish's own tithe-map plots
  behavior: 'On a Rogation evening, two players sit out of sight behind a screen in the parish hall. They
    play Lizzie Magie''s 1904 rules, including ''Absolute Necessity'', the poorhouse, the Public Treasury
    and the Mother Earth corner. The board is hand-redrawn so that each property square is a plot from
    the parish''s tithe apportionment: the mill field, the glebe, and the rows where the audience now
    live. A cheap security camera points straight down at the board and feeds a projector directly. There
    is no recorder, no streaming and no phone in the chain. The congregation sees only the huge live image
    of dice, tokens and paper money crossing their own streets. A reader beside the screen calls each
    move as a versicle. Passing Mother Earth, he says ''Labour upon Mother Earth produces wages'', and
    the hall answers ''We pray thee to hear us.'' When a token lands on an owned plot and rent changes
    hands, he reads the Commination line ''Cursed is he that removeth his neighbour''s landmark.'' Everyone
    answers ''Amen'', and whoever lives on that plot must stand while they say it. The game ends at dusk,
    when the projector is switched off, whoever is winning.'
  rationale: Magie built her game to show players how rent drains a district while they enjoy winning
    it, and in this rite the game is played on the congregation's own land. The live projected board does
    what the parent's camera obscura did. One unseen source feeds one reported image, and it sets an old
    document against the present, without the optics problem. Saying 'Amen' to a curse on your own address,
    live and without a record, turns Magie's argument into a verdict people speak about themselves rather
    than a heritage pageant about someone else's fence.
  card_readings:
  - card: real-time-only
    interpretation: The only image is a direct camera-to-projector feed of the board as it is played,
      with nothing recorded, and the game stops at dusk.
  - card: landlords-game
    interpretation: Lizzie Magie's actual 1904 anti-monopoly game, with its rules, Mother Earth corner
      and rent mechanics, played on a board redrawn from the parish tithe map.
  - card: liturgy
    interpretation: Rogationtide litany and the Commination's 'Amen' to the curse on landmark-movers,
      said as call and response between the reader and the hall.
