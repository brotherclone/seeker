- position: 10
  statement: A camera obscura tent cinema that screens one uncut, unrecorded street film whose only actor
    wears a tabard obeying the heraldic rule of tincture, then breaks it to vanish into the real crowd,
    because heraldry is a legibility code for faceless figures at distance and the obscura's image is
    exactly that.
  subject: A one-take, live camera obscura street film whose lone actor is costumed in a heraldic tabard
  behavior: 'Inside a two-person blackout tent, a fixed lens and mirror throw a busy street corner onto
    a white table for 15 to 20 seated viewers. Outside, one performer plays a single unrehearsed-street,
    scripted-route film in one 20-minute take. Their only costume is a tabard that obeys the rule of tincture:
    or on gules, argent on sable, colour on metal. That makes them the one figure on the low-resolution,
    inverted, faceless table the eye can follow through the real crowd. Strangers become unwitting extras
    who obstruct, cross and frame the action. A narrator inside speaks the herald''s errand: searching
    the street for whoever bears a certain blazon. Nobody in the crowd does, though coats and bags keep
    nearly matching. At the climax the performer reverses the tabard to azure on gules, colour on colour,
    which breaks the rule. On the table they dissolve into the crowd in front of everyone. The audience
    loses its protagonist without any cut. Nothing is recorded, and each showing is a different street.'
  rationale: 'Heraldry''s rule of tincture is not decoration. It is a 12th-century legibility standard
    for recognising someone at distance with no face visible, which is exactly the obscura''s condition:
    low resolution, no close-ups, no cuts. Heraldry here is the working tool that makes a one-take obscura
    film possible, not a lookup table. Breaking the rule is the only way the piece can edit, and the protagonist''s
    vanishing is felt because the audience has spent 20 minutes depending on that tincture to hold onto
    a person.'
  card_readings:
  - card: real-time-only
    interpretation: The film is one live, uncut, unrecorded take shown only on the obscura table as it
      happens, with real passersby as extras who cannot be reshot.
  - card: camera-obscura
    interpretation: A blackout tent with a fixed meniscus lens and mirror projecting a live, inverted
      street corner onto a white table as the only screen.
  - card: heraldry
    interpretation: 'The rule of tincture and the tabard used literally as costume design: medieval visual
      grammar for telling one figure from a faceless crowd at a distance.'
