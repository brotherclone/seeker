  - card: real-time-only
    interpretation: The game clock runs 1:1 with Waterloo's hours and the film is one unedited take, so
      the war never pauses while its commanders are away at prayer.
  - card: kriegsspiel
    interpretation: 'The literal 1824 Reisswitz wargame: map table, metal blocks, written orders, and
