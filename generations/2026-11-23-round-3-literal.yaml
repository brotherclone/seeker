- position: 12
  statement: A camera obscura hide aimed at a winter rook-and-jackdaw roost where the audience counts
    arrivals aloud, first by grey nape, then by flight silhouette as dusk drains colour, then by call
    alone in the dark, because field identification degrades in exactly that order, and the resulting
    tally is a real roost count that exists only if they watched.
  subject: A camera obscura hide aimed at a winter rook-and-jackdaw roost, operated as a dusk cinema whose
    audience performs the evening's roost count
  behavior: 'Two people pitch a blackout tent about twenty metres from a winter corvid roost. A fixed
    one-metre meniscus lens and mirror throw the roost tree, inverted, onto a white table. For the last
    hour of daylight, a bench audience keeps a live arrival count aloud with clickers, splitting rooks
    from jackdaws as they come in. At first they go by plumage: the jackdaw''s grey nape and pale eye
    against the rook''s bare grey face. As the Purkinje shift drains the table, the grey nape disappears,
    and they fall back on jizz: the jackdaw''s smaller, quicker, pigeon-like flight against the rook''s
    ragged wings. When the table goes black, they finish counting by call alone, ''chak'' against ''caah'',
    in a dark room. Nothing is filmed or recorded. At close, the two tallies are read once and phoned
    in as that night''s roost count, with the dark-only portion marked as estimated by ear.'
  rationale: 'Birders already work down a fixed ladder of evidence as light fails: colour field marks
    first, then silhouette and flight, then sound. An obscura at dusk forces that ladder in real time
    on a single table. Each step the audience loses is a real perceptual loss, not a staged one. The count
    is a genuine survey datum that only their attention produces, so it has a recipient and a cost: a
    miscount goes into the record. The piece also plays film history backwards, from colour to monochrome
    to darkness with only the soundtrack left, which is something no recorded screening can do.'
  card_readings:
  - card: real-time-only
    interpretation: The roost arrival happens once per evening and the obscura image cannot be recorded,
      so the count exists only as it is spoken and clicked in the room.
  - card: camera-obscura
    interpretation: A two-person blackout tent with a fixed meniscus lens and 45° mirror trained on one
      roost tree at a known distance, projecting it live and inverted onto a white table.
  - card: ornithology
    interpretation: 'Literal field birding: telling rooks from jackdaws by field marks, then jizz, then
      call, and making a real roost count of the kind local bird surveys collect.'
