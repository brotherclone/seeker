- position: 9
  statement: A one-performer camera-obscura tournament play whose two rival knights differ only by gules
    or vert lions, staged so the final duel falls as dusk drains hue from the table and the audience must
    declare a winner they can no longer tell apart, because heraldry's tincture code fails in failing
    light exactly where the obscura does.
  subject: A live, unrecordable tournament play watched only as a camera obscura projection, in which
    one performer in a reversible heraldic tabard plays two rival knights
  behavior: An audience of a dozen sits in a blackout tent around a white table. A fixed lens throws a
    marked stretch of pavement onto it, upside down and mirror-reversed. One performer outside plays two
    rival claimants to the same arms by turning a reversible tabard. One side is blazoned Or, a lion rampant
    gules, and the other Or, a lion rampant vert. The audience never sees a face. They follow the feud
    through the lion's tincture alone, and a narrator inside reads the blazon aloud each time a knight
    enters. The play is timed so its last act, a single combat between the two lions, falls in the minutes
    when the obscura table loses hue. Red goes dark first, then green, until both lions read only as dark
    beasts on gold. The performer fights himself, falls, and one tabard leaves the lists. The audience
    must then declare aloud which claimant won. Their verdict decides the closing speech, so the ending
    changes with each night's cloud and sunset. Nothing is filmed, because a recording would show a camera's
    colour and not the failing light the audience actually saw.
  rationale: 'Heraldry is a legibility code built for watchers who cannot see faces at a distance, and
    the obscura recreates that viewing condition exactly. Dusk then breaks the code in a known order:
    reds fade first, and light-dark contrast lasts longest. The ambiguity of the final duel is therefore
    not scripted. The audience''s own eyes produce it, and they must then pass judgment on what they could
    not read. The grant now has a cost and a recipient, and so does the dusk.'
  card_readings:
  - card: real-time-only
    interpretation: The ending depends on how that evening's light fails at that minute, so the piece
      exists only live, and any recording would falsify the ambiguity it depends on.
