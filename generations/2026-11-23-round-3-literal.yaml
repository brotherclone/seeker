  subject: A single-take, real-time film of a Kriegsspiel game played as sung Compline in a small chapel
  behavior: Two Kriegsspiel commanders sit in the choir stalls opposite each other, decani against cantoris,
    each screened from the map. Each writes an order, and a cantor chants it on a psalm tone, for example
    'Second battalion shall advance upon the mill.' The umpire stands in the crossing at an 1824 terrain
    table and moves nothing until the congregation sings the reflexive 'Amen' of the printed order of
    service. He chants casualty dice results back as versicles, and those too wait for their Amen. The
    volunteer congregation is told only that this is a sung Compline. The game runs Reisswitz's two-minute
    turns as two real minutes, with no pause and no retakes. One locked-off camera at the back of the
    nave records it as a single uncut take, and the take is screened only at full length.
  rationale: 'Nothing is explained, so nobody is shown an argument. Call and response trains a congregation
    to assent without thinking, and Kriegsspiel needs an authority to ratify each order. Joining the two
    makes the room''s reflex the trigger for the war. The ambush lands on the audience, not on actors:
    some way into the take, the people in the pews realise that every Amen they sang moved the troops.
    The camera catches the moment their voices thin and falter. That faltering is unrepeatable, which
    is why the film can only be one real-time take.'
