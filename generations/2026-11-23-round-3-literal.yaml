- position: 14
  statement: A handcart camera obscura carried around a parish boundary at Rogationtide, its hooded reader
    calling out each landmark sliding across the live table so walkers answer with the litany, or with
    the curse when a fence blocks the old bounds, because beating the bounds was memory without maps and
    an unrecordable moving image puts that memory back at stake.
  subject: A handcart-mounted walk-in camera obscura used to beat the parish bounds
  behavior: 'On a Rogation evening the cart is wheeled around the old parish boundary. Through a hood
    the reader watches the inverted, moving image and calls each mark as it slides across the table: an
    oak, a boundary stone, a culvert. Walkers outside answer ''We beseech thee to hear us.'' When the
    lens shows the boundary cut by a new fence, a locked gate or a building, the reader speaks the Deuteronomic
    curse, ''Cursed is he that removeth his neighbour''s landmark,'' and the walkers answer ''Amen.''
    Nothing is filmed. The perambulation ends where it began, or at dusk if the light gives out first.'
  rationale: 'Beating the bounds began as memory before maps: a parish kept its edges by walking them
    aloud each year, because nothing else held them. A camera obscura has the same condition, an image
    that exists only while it passes. That makes the old rite''s purpose real again rather than decorative.
    The Commination gives the liturgy teeth. The walkers bless what remains, and they also publicly curse
    enclosure, development and lost rights of way as they appear in the live image. So the projected street
    stops being a neutral pleasant picture and becomes contested ground, and the curse lands on real fences
    that real neighbours put up.'
  card_readings:
  - card: real-time-only
    interpretation: The only image is the live tracking shot the moving lens throws on the table, and
      nothing of the walk is recorded or kept.
  - card: camera-obscura
    interpretation: A literal light-tight box on a handcart with a rotating lens-and-mirror turret, projecting
      the passing land upside down onto a white table under a viewing hood.
  - card: liturgy
    interpretation: The Rogationtide beating of the bounds with its litany and the Commination curse on
      those who move landmarks, said as call and response between the reader in the box and the walkers
      outside.
