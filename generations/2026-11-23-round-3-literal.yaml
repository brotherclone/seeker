  statement: A blacked-out shopfront camera obscura where a small congregation keeps a dusk vigil of intercessions
    for strangers crossing the inverted street on the wall, each petition allowed only while its subject
    is in frame, because praying for unknowing passers-by who drift out mid-sentence makes the room a
    cinema of the living that feels like the dead.
  subject: A dusk intercession vigil held inside a blacked-out shopfront camera obscura facing a street
  behavior: 'A street-facing shop or front room is blacked out, with a single lens fitted in the window.
    It throws the pavement outside onto a white sheet on the back wall, upside down and silent. A small
    congregation sits in the dark facing the sheet. One cantor watches the image and improvises the Prayers
    of the People for whoever crosses it. The petitions name strangers only by what can be seen: ''for
    the man carrying the ladder,'' ''for the girl running for the bus.'' The people answer ''Lord, hear
    our prayer.'' The rule is that a petition can only be said while its subject is on the wall. If they
    walk out of frame mid-sentence, the prayer breaks off unfinished and goes unanswered. When the street
    is empty, everyone keeps silence. The vigil starts at dusk and ends when the image fades too far to
    see a face. Nothing is filmed, and no names are known.'
  rationale: Intercession is usually prayed for people who are absent but named. Here it falls on people
    who are present but unknown, and who cannot hear it. The inverted, silent figures on the sheet look
    like the dead or like saints, so the room feels like a dream. It does not work as a civic lesson.
    No one is judged and nothing is proved. Because the image cannot be held, the liturgy is shaped by
    strangers' walking speed, and the half-finished prayers are its real content. A blackout cloth and
    a magnifying lens make it a single evening's build, with no cart and no turret.
  card_readings:
  - card: real-time-only
    interpretation: A petition is only valid while its stranger is in the live projected frame, so the
      prayer has to keep time with an image that cannot be paused or replayed.
  - card: camera-obscura
    interpretation: 'A literal blacked-out room with one window lens projecting the inverted, silent street
      onto a sheet: cinema with no film in it.'
  - card: liturgy
    interpretation: The intercessions from the order of service, said as call and response between a cantor
      and the congregation, aimed at passers-by.
