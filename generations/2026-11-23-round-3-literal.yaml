- position: 11
  statement: A live-cinema piece where Strachey's love-letter algorithm, its word lists replaced by blazon,
    types one projected grant of arms per audience seat onto self-blackening thermal paper, striking each
    coat once granted, because heraldic law allows one bearer per coat, so every love letter costs the
    strangers after you a little more of the language.
  subject: A live-cinema performance in which a microcontroller running Strachey's love-letter algorithm,
    with its word lists replaced by blazon, types a grant of arms as a love letter to one audience seat
    at a time
  behavior: 'About thirty people sit in a small cinema. A thermal printer types at the Ferranti teleprinter''s
    pace while a document camera projects the paper strip onto the screen. Each letter is addressed to
    a seat number and written in Strachey''s syntax, with its word lists swapped for blazon: ''DEAREST
    ROW C SEAT 4, YOU ARE MY GULES CHEVRON. MY ARGENT LONGING CURIOUSLY BEARS YOUR THREE ESCALLOPS. YOURS
    BEAUTIFULLY, M.U.C.'' Once the text has passed the lens, the strip runs under a heat bar that blackens
    the thermal paper, so each letter is seen only once and no copy survives. The program follows the
    heraldic rule that only one person may bear a given coat. Every tincture and charge pairing it grants
    is struck from the lists. The recipient then walks to the console and types one noun of their own
    into the charge list, and later letters may draw on it. Later seats are granted arms built from what
    remains: exhausted tinctures and objects donated by the strangers who came before. The last seat receives
    ''SABLE'' with no charge, and the show ends.'
  rationale: Strachey's letters were made to show that ardour can be a template, and heraldry is a closed
    grammar that guarantees each person a unique identity by rule. Joining them turns the debate's lookup-table
    complaint into the subject itself. You watch the combinatorics assemble your coat in public, and it
    is still addressed to you alone. The one-bearer rule gives every grant a cost, because each coat removes
    options from everyone seated after you. Recipients who donate the next nouns become the authors of
    strangers' arms. The final blank 'SABLE' is a real exhaustion caused by the room, not a scripted punchline.
  card_readings:
  - card: real-time-only
    interpretation: Each letter exists only while it types live under the camera. A heat bar then blackens
      the thermal strip, so no grant can be recorded or replayed.
  - card: strachey-love-letters
    interpretation: Christopher Strachey's 1952 Ferranti Mark 1 love-letter program, signed M.U.C., reimplemented
      with its slot-filling template and slow teleprinter output intact.
  - card: heraldry
    interpretation: Literal blazon of tinctures and charges, together with the heraldic law that no two
      people may bear the same arms, which the program enforces by striking each used combination.
