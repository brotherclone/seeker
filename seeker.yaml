# Seeker local configuration. Paths are relative to this file; ~ is expanded.
# The API key never goes here: set ANTHROPIC_API_KEY or put it in .env (git-ignored).
paths:
  decks: decks
  batches: batches
  generations: generations
  prompts: prompts
  vault: null            # fallback only: put SEEKER_VAULT=~/path/to/vault in .env (git-ignored)

# Seeker's folders inside the vault, relative to its root.
vault_folders:
  works: Works
  cards: Cards

# USD per million tokens. Prices are data: update them as they change.
# Checked 2026-11-12 against the official page,
# https://platform.claude.com/docs/en/about-claude/pricing:
# - Input, output and 5-minute cache writes are as listed below.
# - Cache reads on Opus and Sonnet 5.5 are 0.05x input ($0.20 and $0.10). The
#   2026-11-04 table had 0.1x, so generation records written before this date
#   overstate their cache-read cost slightly.
# - Haiku 5.5 prices rise 5x for prompts over 100,000 tokens ($0.50 in, $2.50 out).
#   That tier is not modelled, because Seeker's Haiku prompts are a few thousand tokens.
# - Web search is $10 per 1,000 searches, plus the tokens its results add. The
#   code execution it uses to filter results is not charged.
prices:
  as_of: 2026-11-12
  models:
    - {model: claude-opus-5-5,   input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00}
    - {model: claude-sonnet-5-5, input: 2.00, output: 10.00, cache_read: 0.10, cache_write: 2.50}
    - {model: claude-haiku-5-5,  input: 0.10, output: 0.50,  cache_read: 0.01, cache_write: 0.125}
