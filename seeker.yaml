# Seeker local configuration. Paths are relative to this file; ~ is expanded.
# The API key never goes here: set ANTHROPIC_API_KEY or put it in .env (git-ignored).
paths:
  decks: decks
  batches: batches
  generations: generations
  prompts: prompts
  vault: null            # fallback only: put SEEKER_VAULT=~/path/to/vault in .env (git-ignored)

# Seeker's folders inside the vault, relative to its root.
vault_folders:
  works: Works
  cards: Cards

# USD per million tokens. Prices are data: update them as they change.
# Input/output: list prices checked 2026-11-04 (https://computeprices.com/api-pricing/claude).
# Cache: 5-minute write = 1.25x input, read = 0.1x input, per
# https://www.eesel.ai/blog/anthropic-api-pricing (edited 2026-09-08), which shows
# the same ratios for the 5.x line. The official page is
# https://platform.claude.com/docs/en/about-claude/pricing; re-check the 5.5 cache
# rates there when you next update this table.
prices:
  as_of: 2026-11-04
  models:
    - {model: claude-opus-5-5,   input: 4.00, output: 20.00, cache_read: 0.40, cache_write: 5.00}
    - {model: claude-sonnet-5-5, input: 2.00, output: 10.00, cache_read: 0.20, cache_write: 2.50}
    - {model: claude-haiku-5-5,  input: 0.10, output: 0.50,  cache_read: 0.01, cache_write: 0.125}
