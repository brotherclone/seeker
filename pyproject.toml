[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "seeker"
version = "0.1.0"
description = "An idea engine for creative tech: card collisions, prior-art checks, adversarial agent debate."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Gabriel Walsh", email = "brotherclone@gmail.com" }]
dependencies = [
  "pydantic>=2.9,<3",
  "PyYAML>=6.0",
  "linkml-runtime>=1.9",
  "anthropic>=2.0,<3",
]

[dependency-groups]
# Installed by default with `uv sync`. Exports in schema/generated/ are compared
# byte-for-byte, so pin the generator minor version; bump deliberately and rerun
# `make schema`.
dev = [
  "linkml>=1.12.1,<1.13",
  "pytest>=8",
]

[project.scripts]
seeker-debate = "seeker.debate.cli:main"
seeker-decks = "seeker.decks.cli:main"
seeker-draw = "seeker.draw.cli:main"
seeker-generate = "seeker.generate.cli:main"
seeker-works = "seeker.works.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["seeker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
